# Repository guards — the platform-side mirror of the pre-commit hook.
#
# The hook protects commits made through it. This workflow protects the
# repository: it re-runs the same two checks against content that arrived by
# any route (web editor, merge, a clone whose hooks were never bootstrapped).
#
# Runs on both platforms. The comment here used to say "nothing here touches
# native behaviour — it is a text scan and a blob inspection — so the faster
# runner costs no coverage." That stopped being true when `proof:provision` was
# added, which downloads, hash-verifies, extracts and spawns a binary.
#
# The cost of it staying wrong: this workflow is the ONLY one that runs
# proof:guards, proof:provision, guardFiles --tree and scanSecrets, and it ran
# on ubuntu alone. So the win32 bsdtar branch, zip extraction, the rename-EPERM
# path and three win32 pinned digests were executed by no CI job at all — on the
# platform this application targets and is developed on daily. This project has
# already shipped a defect that changed depending on which terminal was used,
# and CI was structurally blind to it for exactly this reason.
name: Guards

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CANCELLING IS FOR BRANCHES. `main` NEVER CANCELS.
#
# A cancelled run is not a weaker green — it is **no verdict at all**, and the
# commit it belonged to carries none afterwards. Grouped by ref with
# `cancel-in-progress: true` everywhere, every rapid push to `main` destroyed the
# previous commit's verdict: `9292d1f`, `142a2d6` and `53eafae`, the same
# mechanism each time. A bisect then lands on commits CI never evaluated, and the
# per-commit board reading this project relies on becomes a fact about the tip
# and nothing else.
#
# The trade, stated rather than glossed: two runs may now overlap on `main`, so a
# rapid push costs runner minutes twice and feedback on the newer commit arrives
# behind the older one. What it buys is that *push, read the board, then push* is
# no longer a rule somebody has to recall at the moment they are about to push —
# which is this repository's own argument for preferring a mechanism to a note.
# It failed as a note three times.
#
# Branches keep cancelling, where superseding a run is the whole point and no
# commit's verdict is being relied on later.
#
# MEASURED, not assumed that the expression takes effect. Read from
# `actions/runs?per_page=8` on 2026-08-26, minutes after `6d8f2d5` was pushed on
# top of a still-running `8b99118`:
#
#   CI      8b99118  in_progress     <- survived the push
#   Guards  6d8f2d5  in_progress     <- and the newer run started anyway
#   CI      53eafae  cancelled       <- the same group under the old setting
#
# Two runs coexisting on `main`, with the pre-fix cancellation visible in the
# same payload as the control. `8b99118` then completed `success`, so the verdict
# a push used to destroy is the verdict it now keeps.
concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guards:
    name: Secret scan and file policy (${{ matrix.os }})
    strategy:
      # Windows is the target and the daily development platform, so it must
      # pass. Linux stays as the differential: when a step fails on one and not
      # the other, the difference is the platform.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # See ci.yml for why pipefail is load-bearing rather than decoration.
        shell: bash -euo pipefail {0}
    steps:
      # Actions are pinned by commit SHA, not by tag. A tag is mutable: whoever
      # controls the action's repository can repoint v7 at different code, and
      # that code runs with this workflow's token. This is the same pinning
      # discipline Part J applies to every downloaded binary, applied to the
      # same class of risk.
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the commit log, not the working tree, so a shallow
          # clone would silently scan almost nothing and still report success.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # EXACT, not a major — see the note in ci.yml and
          # scripts/lib/toolchain.mjs. A floating major means the runtime under
          # every proof here can change between two runs of the same commit.
          node-version: 24.19.0

      # The guards are proven before they are trusted. Rule B2 requires every
      # check to ship a control case, and these run first so a guard that has
      # stopped detecting anything fails the build loudly rather than passing
      # a tree it no longer inspects.
      #
      # These steps are deliberately order-independent: each provisions what it
      # needs. An earlier revision put the proofs before provisioning and the
      # job went red, because the gate's pass-path case cannot run without a
      # scanner. A step order that must be remembered is a step order that will
      # eventually be got wrong.
      #
      # EVERY PROOF BELOW RUNS THROUGH scripts/ci/annotate.mjs (finding CCC-1).
      # Actions serves logs only to authenticated callers, so a proof that fails
      # here is fully diagnosable by the owner and completely opaque to everyone
      # else. The wrapper re-emits a failing script's own output as a public
      # annotation, and it was written for exactly that — then applied to three
      # steps in ci.yml and to NONE here, which is where the guard proofs live.
      #
      # Measured: `proof:advisories` went red on windows-latest at a0d2ec0 with
      # ubuntu-latest green, and the only public evidence was the step name. The
      # reusable remedy existed and had not been rolled out — the same half-fix
      # shape as W-1/X-1/Z-1, where the instance was repaired and the class was
      # left. It is invoked by SCRIPT PATH rather than through `npm run` so the
      # wrapper spawns the proof directly; that drops the npm-run environment,
      # and only two proofs anywhere touch it — rendererPolicy.proof.mjs, which
      # already runs wrapped in ci.yml, and preCommit.proof.mjs, which deletes
      # `npm_execpath` deliberately because inheriting it hid a branch.
      - name: Prove the guards still catch what they claim
        run: |
          node scripts/ci/annotate.mjs scripts/hooks/guardFiles.proof.mjs
          node scripts/ci/annotate.mjs scripts/hooks/preCommit.proof.mjs
          node scripts/ci/annotate.mjs scripts/hooks/prePush.proof.mjs
          node scripts/ci/annotate.mjs scripts/bootstrapHooks.proof.mjs

      # Before the proofs that report failures, because a blind reporter turns
      # every red step below it into a message nobody can act on. Both platforms
      # run it deliberately: the errno a failed rename produces is exactly what
      # differs between them.
      - name: Prove a failure report carries its diagnosis
        run: node scripts/ci/annotate.mjs scripts/lib/reportError.proof.mjs

      # The other half of the same property — what a PASS says — and it needs no
      # platform argument at all. The two ran under one step name while they
      # shared a file, so the sentence above, which is only true of the reporter,
      # stood as the reason for both. Split so each step's reason is true of the
      # step it is attached to.
      - name: Prove an ok line cannot outlive the case that earned it
        run: node scripts/ci/annotate.mjs scripts/lib/passRoster.proof.mjs

      # The same property a third time, about the instrument that decides whether
      # THIS board is green. It failed twice in one day and both times printed
      # "not yet", which for a waiter is the reassuring answer exactly as "found
      # nothing" is for a search. Runs over recorded payloads and makes NO
      # request: a check that reached github.com from here would be a third
      # instance of the live-third-party dependency this repository already has
      # twice, and the only one of the three inside CI.
      - name: Prove the board reader knows "not yet" from "cannot see"
        run: node scripts/ci/annotate.mjs scripts/lib/boardStatus.proof.mjs

      # A fourth instrument about CI's own legibility. Actions serves LOGS only
      # to authenticated callers, so a proof that fails on a runner is opaque to
      # everyone but the owner — measured, when `proof:rendererpolicy` failed on
      # windows-latest and the only public evidence was "Process completed with
      # exit code 1". Annotations need no token, so the wrapper moves the bytes
      # the runner already printed into a place anybody can read.
      - name: Prove a failing step's own words reach a public annotation
        run: node scripts/ci/annotate.mjs scripts/proofs/annotate.proof.mjs

      # The Electron pin cannot drift from the dependency and cannot be routed
      # around. Reads tracked files only and downloads NOTHING: proof:provision
      # already makes four live github.com fetches per run and is a recorded open
      # finding for it, so a second proof pulling ~100 MB would be the third
      # instance and by far the largest. The download path is not unproven as a
      # result — `downloadVerified` is the primitive proof:provision exercises
      # against a real server, and the Electron provisioner is its third
      # consumer rather than a third copy.
      #
      # "Reads tracked files only" is a CONSTRAINT ON WHAT MAY BE ADDED HERE, not
      # a description of what the file happens to contain today. A parse-based
      # case was added to it and turned this job red on both platforms, skipping
      # nineteen later steps including the full-history secret scan: the scan
      # loads the TypeScript compiler and this job runs no `npm ci`. That case
      # now lives in ci.yml's build job as proof:electronimports, beside the two
      # other loadTypeScript consumers. A case needing node_modules does not
      # belong in this job however much it belongs with these ones.
      - name: Prove the Electron pin cannot drift or be bypassed
        run: node scripts/ci/annotate.mjs scripts/provision/electron.proof.mjs

      - name: Prove provisioning is safe under concurrency
        run: node scripts/ci/annotate.mjs scripts/provision/gitleaks.proof.mjs

      # AND THE DOWNLOAD PRIMITIVE UNDERNEATH IT. The step above went red on
      # 2026-08-25 with `read ECONNRESET` — a release host dropping one racer's
      # TLS connection — so `downloadVerified` now retries what nobody answered.
      #
      # This step exists for the OTHER half: a retry on a verified download is
      # dangerous in exactly one direction, and its load-bearing cases are the
      # refusals. A digest mismatch retried is downloading until the hash
      # matches, on the check that stands between a pinned asset and whatever a
      # host served instead.
      - name: Prove a verified download retries a reset and never a mismatch
        run: node scripts/ci/annotate.mjs scripts/proofs/fetchVerified.proof.mjs

      # The scan below is only worth its runtime if it cannot be silently
      # disarmed. This proves each suppression channel is closed AND, by running
      # the corpus without each closure, that the closure is what shuts it —
      # neither half is evidence alone.
      - name: Prove the secret scan cannot be disarmed
        run: node scripts/ci/annotate.mjs scripts/lib/secretScan.proof.mjs

      # Three claims in a row were true only because of state nothing was
      # watching. The mechanism that fixes that class has to be able to detect a
      # change itself, or it is the fourth instance wearing the uniform of the
      # fix — so every input kind is resolution-tested here.
      - name: Prove a verdict's inputs detect a change
        run: node scripts/ci/annotate.mjs scripts/lib/verdict.proof.mjs

      # A native measurement taken through a DLL built from older source still
      # runs and still prints plausible numbers. Runs here rather than in the
      # native job because it needs only the tracked shim source, not a build.
      - name: Prove a stale shim is refused rather than measured
        run: node scripts/ci/annotate.mjs scripts/lib/shimBinary.proof.mjs

      # The withdrawn-phrase check unblocked Stage 0 and shipped with no proof.
      # Three false negatives had already got through it — a tilde, a table row,
      # and a phrase wrapped across a line break — each found by grepping the
      # real tree by hand, which only ever finds what someone thinks to look for.
      - name: Prove the withdrawn-phrase check catches what it claims
        run: node scripts/ci/annotate.mjs scripts/lib/withdrawnPhrases.proof.mjs

      # THE CLASS THAT MADE A COULD-NOT-LOOK COUNT AS A PASS. `unverifiable.mjs`
      # exports the tokens `npm run local` keys on and six files spelt their own,
      # one of which was measured being recorded green in 1.74s against 20.1s for
      # a real run. The scan reads source only, so it belongs here rather than on
      # a job that builds.
      - name: Prove the could-not-look spelling scan sees, refuses and tolerates
        run: node scripts/ci/annotate.mjs scripts/proofs/unverifiableSpelling.proof.mjs

      - name: No script spells a could-not-look verdict of its own
        run: node scripts/ci/annotate.mjs scripts/lib/unverifiableSpelling.mjs

      # The standing rule against writing files through escape-resolving shell
      # paths was broken six times while claiming to be the only defence. It is
      # now a PreToolUse hook. This checks both halves: that the guard blocks
      # what it claims and permits what this project actually runs, and that
      # .claude/settings.json still wires it to both shells — a correct script
      # nothing invokes would leave every case above passing over an open door.
      - name: Prove the escape-resolving-write hook is wired and discriminates
        run: node scripts/ci/annotate.mjs scripts/hooks/blockEscapeResolvingWrites.proof.mjs

      # A hook cannot detect its own absence. A settings file at a scope above
      # the project's — personal, gitignored, in nobody's diff — can carry
      # disableAllHooks or a competing hooks block, which is the .gitleaksignore
      # shape again. The git pre-commit hook refuses; this proves it refuses for
      # the right reasons and stays quiet for a contributor's ordinary settings.
      - name: Prove a locally disarmed tool-use guard is detected
        run: node scripts/ci/annotate.mjs scripts/lib/hookIntegrity.proof.mjs

      # Everything above proves the guard's PARTS. None of it can reach the one
      # thing CLAUDE.md actually asserts — that the hook is loaded in the agent
      # session doing the writing — because that lives in the agent's own hook
      # table. So it is a Stage 0 exit gate, and this proves the gate cannot be
      # satisfied by a record that only looks like evidence: one about a
      # different guard, one taken in a session whose process predates the
      # configuration (which is what produced the first attempt's result), or
      # one that honestly says the guard did not fire.
      - name: Prove the tool-use guard gate cannot be claimed unproven
        run: node scripts/ci/annotate.mjs scripts/proofs/hookProbe.proof.mjs

      # Downloads a deliberately older gitleaks — one that runs the shipped
      # invocation, exits like a healthy scan, and quietly finds one family
      # fewer. Every other case for the canary runs against the pinned build,
      # which is the one binary it is not meant to be for.
      - name: Prove the canary rejects an older scanner
        run: node scripts/ci/annotate.mjs scripts/lib/scannerCanary.proof.mjs

      # The memory budgets are read from invariant §9.17 rather than defined as
      # constants (ADR-0012), so the number a human reads is the number the
      # build enforces. Almost every case here asserts a REFUSAL: a parser for a
      # limit has one dangerous failure, yielding a plausible number when it
      # should have stopped, and a fallback is how a withdrawn budget returns
      # silently.
      - name: Prove the budgets are read, never substituted
        run: node scripts/ci/annotate.mjs scripts/proofs/memoryBudgets.proof.mjs

      # The document checker enumerates from the commit and must read from it
      # too. It used to read the filesystem, which is a different scope with a
      # state of its own — tracked but absent from the working tree — and that
      # state crashed it. Guarding the state left a document unchecked while the
      # checker printed success; aligning the scopes removes it.
      - name: Prove the document checker reads the scope it enumerates
        run: node scripts/ci/annotate.mjs scripts/proofs/documentScope.proof.mjs

      # And that every rule DECLARES a scope, so the cheap ones can run in
      # pre-commit while the whole-corpus ones stay here. The load-bearing case
      # is that at least one rule is per-document: a scoping expression matching
      # nothing produces the reassuring answer, and the pre-commit gate would
      # then report success for a check that never ran.
      - name: Prove every document rule declares a scope, and the scope selects
        run: node scripts/ci/annotate.mjs scripts/proofs/documentRuleScope.proof.mjs

      # And that the row-length ratchet can SEE the rows it governs. It keyed
      # rows on a leading bold title, so a row that opens in plain text was
      # compared with nothing and reported nothing — 43 rows keyed against 204
      # table lines, and a row measured growing from 390 words to 498 with the
      # check green. The load-bearing case is the unbolded fixture, which asserts
      # what the broken key printed for that exact input: no match at all.
      - name: Prove the FEATURES row-length ratchet can see, pair and refuse
        run: node scripts/ci/annotate.mjs scripts/proofs/rowLengthRatchet.proof.mjs

      # The picker's gate is the only evidence `documentPicker.ts` has ever
      # executed, and that evidence is a JSON file in the repository — so every
      # way of getting it wrong produces something that reads like evidence: no
      # record, a record of a dismissed dialog, or a record written against code
      # that has since changed. The load-bearing case is the fourth, that a
      # record which genuinely does vouch reads as observed, because a state
      # machine answering "not observed" to everything satisfies the other three
      # and makes the gate permanently red — which is how a gate gets deleted.
      #
      # No Electron here. This proves the RECORD, against temporary trees it
      # builds; the dialog itself is a person's job and is what the record is of.
      - name: Prove the picker's record cannot vouch for a picker nobody drove
        run: node scripts/ci/annotate.mjs scripts/proofs/pickerProbe.proof.mjs

      # The staleness guard two renderer proofs consult before believing
      # anything, which had no coverage at all while it lived as a private
      # function inside one of them (finding KKKKK-2's neighbour). Every way it
      # can be broken produces "the build is fine": a source newer than its
      # artefact missed, a directory walk that reads nothing and returns 0, a
      # pair list quietly shorter than the proof needs. So every case here has a
      # partner asserting it also says YES — a guard that refused everything
      # would satisfy the first half perfectly and be deleted within a week.
      #
      # Here rather than in ci.yml: it builds temporary trees and needs neither
      # Electron nor a display, so it belongs on the job that installs nothing.
      - name: Prove the build-staleness guard separates, and can say yes
        run: node scripts/ci/annotate.mjs scripts/proofs/buildFreshness.proof.mjs

      # Facts one document states about another, checked mechanically. Three
      # separate drifts reached main because each was maintained by hand, and
      # reviewing the changed file never shows the stale one.
      - name: Document consistency
        run: node scripts/ci/annotate.mjs scripts/hooks/documentConsistency.mjs

      # Check 7 guards a document that does not exist yet, so nothing exercises
      # it in the ordinary course of work: check:docs finds no threat model,
      # skips the block and prints ok. A requirement never observed to fail is
      # indistinguishable from one that cannot. The case that matters is the
      # shallow one — a component list naming Leptonica, and "we only open PDFs"
      # — because that is what a threat model written in a hurry looks like.
      - name: Prove the carried threat-model questions can fail
        run: node scripts/ci/annotate.mjs scripts/proofs/threatModelTopics.proof.mjs

      # The audit watermark gate guards a condition that is false almost all the
      # time, so nothing in ordinary work exercises it — and a gate never
      # observed to fail is indistinguishable from one that cannot. Both halves
      # are proven over a throwaway repository: the size threshold must trip past
      # one batch and must NOT trip below it, since an always-red gate gets
      # switched off rather than obeyed.
      - name: Prove the stage-audit watermark gate can fail
        run: node scripts/ci/annotate.mjs scripts/proofs/auditScope.proof.mjs

      # A workflow naming a path inside the provisioned Electron tree embeds the
      # pin where nothing checks it against ELECTRON_VERSION: when the pin moves,
      # the step names a directory that no longer exists and the failure arrives
      # as a missing file on a runner rather than as a diff anybody can read.
      #
      # The scan's reassuring answer is "found nothing", so it carries a positive
      # control and REFUSES to report a clean result when that control is not
      # located — a blinded search here would otherwise certify the property it
      # can no longer see. The proof runs first because it is what establishes
      # the scan can also refuse, and can tolerate the commented occurrences that
      # explain why the path is dangerous (finding GG-8).
      - name: Prove the workflow-path scan can see, refuse and tolerate
        run: node scripts/ci/annotate.mjs scripts/proofs/workflowPins.proof.mjs

      - name: No workflow names a path inside the provisioned Electron tree
        run: node scripts/ci/annotate.mjs scripts/lib/workflowPins.mjs

      # A cancelled run is NO VERDICT AT ALL, so a workflow that cancels
      # in-progress runs on `main` destroys the previous commit's board reading
      # on every rapid push — three times before this scan existed. The proof
      # runs first because it is what establishes the scan can see a cancelling
      # workflow at all; its reassuring answer is "found nothing", which is also
      # what a matcher anchored wrong produces.
      - name: Prove the main-never-cancels scan can see, separate and tolerate
        run: node scripts/ci/annotate.mjs scripts/proofs/mainNeverCancels.proof.mjs

      - name: No workflow cancels an in-progress run on main
        run: node scripts/ci/annotate.mjs scripts/lib/mainNeverCancels.mjs

      # The prose sweep takes a pattern, so there is nothing for it to assert
      # about the tree and only its proof runs here. What the proof holds is that
      # it sees a phrase broken across a line break AND that a line-scoped search
      # misses the same phrase — a control a grep would also pass would prove
      # nothing about the one thing this instrument exists for.
      - name: Prove the prose sweep sees what a line-scoped search cannot
        run: node scripts/ci/annotate.mjs scripts/proofs/proseSweep.proof.mjs

      # Runs HERE, on Linux, with no native library involved: the check is pure
      # arithmetic on what koffi returns, and the value it must reject was
      # measured once on Windows and is pinned in the proof. A defect that lived
      # in three files at once should not need a Windows runner to catch
      # (finding TT-2).
      - name: Prove the invalid-handle check catches what four spellings missed
        run: node scripts/ci/annotate.mjs scripts/proofs/win32Handle.proof.mjs

      # A wrapper's reassuring answer is "everything passed", and four different
      # things print it — a clean tree, a misread exit code, a mis-parse of the
      # spawn result, and an empty selected set. The first version of that tool
      # invented failures, which announced itself in one run; inventing passes is
      # the silent direction and was the one nothing watched (finding QQQ-2).
      # Needs no node_modules: it spawns node on fixture files it writes itself.
      - name: Prove the local check sweep can report a failure at all
        run: node scripts/ci/annotate.mjs scripts/proofs/checkLocal.proof.mjs

      # The roster that sweep derives, and the anchor that runs the other way.
      - name: Prove the pre-push roster comes from these files, and the anchor bites
        run: node scripts/ci/annotate.mjs scripts/proofs/ciVerifiers.proof.mjs

      # The proof first, because it is what establishes the scan can SEE — a
      # search's silence is worthless until something known-present proves it is
      # not blind. The scan then carries the same control itself, since it gets
      # run by hand on the day someone needs an answer and CI is not there.
      - name: Prove the emitted-source backtick scan sees, refuses and tolerates
        run: node scripts/ci/annotate.mjs scripts/proofs/emittedTemplates.proof.mjs

      - name: No emitted-source template carries a backtick
        run: node scripts/ci/annotate.mjs scripts/lib/emittedTemplates.mjs

      # The Electron-binary caller scan, here rather than on the shim job
      # because it reads source text and needs no Windows, no node_modules and
      # no built surface. Its TypeScript half — the brand on
      # `Win32HostSurfaceConfig.executablePath` — is enforced by `npm run
      # typecheck` on the matrix job; this half exists because the plain-Node
      # callers reach the surface through a computed `import()`, which types as
      # `any`, so no brand can constrain them.
      # The control-character reporter, registered for Write and Edit since
      # 2026-08-24 and recorded UNOBSERVED — see the FEATURES row. It reports
      # after the write and cannot prevent one, so guardFiles.mjs at commit is
      # still the only fail-closed gate here. Observing it act needs a payload
      # carrying the byte, which nobody has managed to produce on purpose, so
      # this proof is what stands behind it until the defect recurs: a mechanism
      # that has not been seen in force must still be the one that will work
      # when it is.
      - name: Prove the control-character reporter sees, and does not cry wolf
        run: node scripts/ci/annotate.mjs scripts/proofs/reportControlCharacters.proof.mjs

      # One rule for what counts as this repository invoking its own script. Two
      # modules each had their own pattern and both were correct, which is why
      # the control is the real workflow corpus rather than unit cases: a
      # consolidation that silently changes one caller's answer on one line looks
      # exactly like one that worked.
      - name: Prove consolidating the invocation pattern changed nobody's answer
        run: node scripts/ci/annotate.mjs scripts/proofs/workflowInvocations.proof.mjs

      # Every entry point CI enters guards main through the one resolver, or not
      # at all. The roster is DERIVED from the npm scripts rather than kept by
      # hand, because a hand-kept list of files-needing-a-guard would be the
      # second wiring place and would be one short on the day it mattered.
      - name: Prove the main-guard scan sees, refuses and tolerates
        run: node scripts/ci/annotate.mjs scripts/proofs/mainGuards.proof.mjs

      - name: Every entry point guards main through the one resolver
        run: node scripts/ci/annotate.mjs scripts/lib/mainGuards.mjs

      # The GitHub API budget. Needs no network — the property under test is the
      # decision, and a case that hit the real API to prove a quota mechanism
      # would spend the quota it is about.
      - name: Prove the API budget refuses a bulk walk before it starves the board
        run: node scripts/ci/annotate.mjs scripts/proofs/githubFetch.proof.mjs

      - name: Prove the Electron-binary caller scan sees, refuses and tolerates
        run: node scripts/ci/annotate.mjs scripts/proofs/electronBinaryCallers.proof.mjs

      - name: Every host caller names the Electron binary through the one resolver
        run: node scripts/ci/annotate.mjs scripts/lib/electronBinaryCallers.mjs

      # The syntax parse and its blob reader. Same job as the backtick scan
      # because they are the same class one delimiter apart — a `*/` inside a
      # JSDoc block is what the parse was added for, and the backtick scan
      # cannot see it. Needs no node_modules: it builds throwaway git
      # repositories and spawns node on them.
      - name: Prove the staged-syntax parse sees, refuses and reads the index
        run: node scripts/ci/annotate.mjs scripts/proofs/stagedSyntax.proof.mjs

      # UUU-3. Both of these were registered in package.json and invoked by no
      # job until check:proofcoverage went looking — which is the finding, not
      # the fix: the wiring closes two instances and the check closes the class.
      - name: Prove the tree witness can tell a still tree from a moving one
        run: node scripts/ci/annotate.mjs scripts/proofs/treeWitness.proof.mjs

      # A proof CI never executes is a green board that verified nothing. This
      # is the wired-tools rule at the level of registration, and no other check
      # here looks at ABSENCE — annotateCoverage examines invocations that
      # exist, jobPlacement examines steps that exist.
      # The proof first, so the check's silence is worth something when it runs.
      # A probe that exits 0 having measured nothing makes "could not look" and
      # "looked and found nothing" the same observation. Three probes decided
      # that for themselves and two got it wrong in the permissive direction, on
      # the jobs where a could-not-look cannot legitimately happen. The rule is
      # one module now; this proves both of its directions.
      #
      # Here rather than on a Windows job: the rule is pure JavaScript and reads
      # no platform, which is what lets it be checked where nothing is installed.
      - name: Prove a could-not-look is not a pass, and is not a failure either
        run: node scripts/ci/annotate.mjs scripts/proofs/unverifiable.proof.mjs

      - name: Prove the proof-coverage search sees, refuses and matches by path
        run: node scripts/ci/annotate.mjs scripts/proofs/proofCoverage.proof.mjs

      - name: Every proof script is invoked by some job
        run: node scripts/ci/annotate.mjs scripts/lib/proofCoverage.mjs

      # The local sweep resolves what an npm script RUNS instead of refusing
      # anything that is not a bare `node` invocation — which is how typecheck,
      # lint and build sat in its roster running nothing. The failure to fear is
      # now a step it cannot understand being dropped rather than reported.
      - name: Prove the npm-script resolver sees, recurses and refuses
        run: node scripts/ci/annotate.mjs scripts/proofs/npmScriptSteps.proof.mjs

      # The sweep's replacement for a disclaimer that failed. It NAMES the proofs
      # a local run did not execute, derived from the changed set and the import
      # graph, so the reader gets an instruction rather than a caveat. Its
      # resolution test is the change that reddened main at 3a903fd, and the
      # first version of the instrument failed it silently.
      - name: Prove the affected-proof list sees, refuses and stays quiet
        run: node scripts/ci/annotate.mjs scripts/proofs/affectedProofs.proof.mjs

      # EEE-3, and it closes Y-3's shape rather than adding a third list. The
      # annotate wrapper was rolled out by enumeration — three steps in ci.yml,
      # none here — and nothing made that list complete. This derives the set of
      # proofs from package.json and requires every workflow line running one to
      # name the wrapper, so a proof registered tomorrow is covered the moment it
      # exists.
      - name: Prove the annotate-coverage scan sees, refuses and tolerates
        run: node scripts/ci/annotate.mjs scripts/proofs/annotateCoverage.proof.mjs

      - name: Every workflow proof step reaches a public annotation
        run: node scripts/ci/annotate.mjs scripts/lib/annotateCoverage.mjs

      # The pin these very jobs run on is one declaration, not three copies. A
      # workflow left on a floating major keeps working and keeps passing while
      # changing the npm that validates this project's lockfile — which is how
      # CI came to reject a lockfile that every developer machine accepted.
      - name: Prove the toolchain pin is one declaration
        run: node scripts/ci/annotate.mjs scripts/proofs/toolchainPin.proof.mjs

      # MuPDF is compiled into the shim and parses the most attacker-controlled
      # input this application has. Pinning it is correct — it makes builds
      # reproducible — but a pin with nothing watching it is how a project ships
      # a known-vulnerable parser for a year. This fails when an advisory has no
      # recorded verdict; it does not invent one, because the available data is
      # keyed to distribution packages whose versions do not map onto upstream.
      # DELIBERATELY WITHOUT --require-derivation, and there are now TWO
      # derivations this applies to, not one. This job provisions no MuPDF, so
      # the OCR door derivation cannot run — and it runs no `npm ci` at all, so
      # the Electron surface derivation cannot run either: `node_modules` is
      # absent, which is this job's normal state rather than a fault. Both report
      # their symbols as unverifiable — counted apart, printed, never folded into
      # verified.
      #
      # The shim job in ci.yml has the MuPDF source AND installs, so it passes
      # the flag and both derivations are mandatory exactly where something can
      # look.
      #
      # proof:electronsurface runs in ci.yml's BUILD job, not the shim job and
      # not here. It needs the TypeScript compiler, which this job has no
      # node_modules to load from — and the build job is a MATRIX over both
      # platforms, where the shim job is a single runner, windows-latest. That
      # matters because the parse is platform-independent but LOCATING THE
      # COMPILER IS NOT: `file://` plus backslash replacement is a Windows
      # branch and a plain path is the other, so only a job running both
      # executes both.
      #
      # CORRECTED 2026-08-23 (finding UUU-1): this said "the shim job is
      # ubuntu-only". It is windows-latest and always has been. The placement
      # still holds, for the branch-coverage reason above rather than the
      # platform one that was given.
      #
      # This sentence previously said the shim job was the only one that runs it,
      # which stopped being true in the commit that moved it — and the half
      # explaining WHY this job cannot run it stayed true, which is what made the
      # dead half invisible.
      #
      # Adding the flag here would turn every Guards run red on both platforms,
      # which is what happened for two days when the witness rule treated "could
      # not derive" as "was not derived" — the rule's own distinction, broken by
      # its own implementation.
      - name: Native engine advisories
        run: node scripts/ci/annotate.mjs scripts/security/engineAdvisories.mjs

      # The register above is only as good as its inability to pass while
      # unreadable. Its parse used to be wrapped in a bare `catch` returning an
      # empty baseline, and every reachability verdict is a search whose broken
      # state and whose clean state print the same thing. This proves the parse
      # fails ON THE PARSE, and that the walk finds a symbol known to be there
      # before any "no references" it reports is believed.
      - name: Advisory register cannot be silently disarmed
        run: node scripts/ci/annotate.mjs scripts/proofs/advisoryRegister.proof.mjs

      # The advisory check reaches a third party, and on 2026-08-25 that party
      # answered HTTP 503 and reddened `main` on a commit that touched nothing
      # near it. The retry that closes it is one line from being the banned
      # reflex, so the helper is built to refuse: only a TransientFailure is
      # tried again, an empty result or a 404 propagates on the first attempt,
      # and exhausting the attempts throws rather than returning.
      #
      # Its load-bearing cases are the refusals, not the retry.
      - name: Trying again is bounded, fails closed, and never happens for an answer
        run: node scripts/ci/annotate.mjs scripts/proofs/retryTransient.proof.mjs

      # And the CALL SITE, which is the half that was unproven (finding DDDD-14).
      # The step above covers the retry mechanism with hand-built throws; this one
      # covers what OSV's answers MEAN — a thrown fetch and a 5xx are nobody
      # answering, a 404 is an answer and is not retried.
      #
      # Its load-bearing case is the 404. An adapter that retried everything
      # passes every other case here.
      - name: What OSV answered, and what nobody answering looks like
        run: node scripts/ci/annotate.mjs scripts/proofs/osvQuery.proof.mjs

      - name: File policy (whole tree)
        run: node scripts/ci/annotate.mjs scripts/hooks/guardFiles.mjs --tree

      # The tree scope sees only what survives to the tip. A blob committed and
      # then deleted is gone from `git ls-files` and retained by GitHub forever,
      # which is precisely what B10 is about — so the binary/size/fixture half of
      # L15 needs the same history reach the secret scan below already has.
      #
      # Scoped to what the change introduces rather than to all of history: the
      # eight blobs that predate 45eb4fb cannot be removed, so gating on them
      # every run would be a red build people learn to ignore.
      - name: File policy (history introduced by this change)
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            node scripts/ci/annotate.mjs scripts/hooks/guardFiles.mjs --history \
              --range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            node scripts/ci/annotate.mjs scripts/hooks/guardFiles.mjs --history \
              --range "${{ github.event.before }}..${{ github.sha }}"
          fi

      - name: Secret scan (full history)
        run: node scripts/ci/annotate.mjs scripts/hooks/scanSecrets.mjs
