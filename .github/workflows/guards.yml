# Repository guards — the platform-side mirror of the pre-commit hook.
#
# The hook protects commits made through it. This workflow protects the
# repository: it re-runs the same two checks against content that arrived by
# any route (web editor, merge, a clone whose hooks were never bootstrapped).
#
# Runs on both platforms. The comment here used to say "nothing here touches
# native behaviour — it is a text scan and a blob inspection — so the faster
# runner costs no coverage." That stopped being true when `proof:provision` was
# added, which downloads, hash-verifies, extracts and spawns a binary.
#
# The cost of it staying wrong: this workflow is the ONLY one that runs
# proof:guards, proof:provision, guardFiles --tree and scanSecrets, and it ran
# on ubuntu alone. So the win32 bsdtar branch, zip extraction, the rename-EPERM
# path and three win32 pinned digests were executed by no CI job at all — on the
# platform this application targets and is developed on daily. This project has
# already shipped a defect that changed depending on which terminal was used,
# and CI was structurally blind to it for exactly this reason.
name: Guards

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Secret scan and file policy (${{ matrix.os }})
    strategy:
      # Windows is the target and the daily development platform, so it must
      # pass. Linux stays as the differential: when a step fails on one and not
      # the other, the difference is the platform.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # See ci.yml for why pipefail is load-bearing rather than decoration.
        shell: bash -euo pipefail {0}
    steps:
      # Actions are pinned by commit SHA, not by tag. A tag is mutable: whoever
      # controls the action's repository can repoint v7 at different code, and
      # that code runs with this workflow's token. This is the same pinning
      # discipline Part J applies to every downloaded binary, applied to the
      # same class of risk.
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the commit log, not the working tree, so a shallow
          # clone would silently scan almost nothing and still report success.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The guards are proven before they are trusted. Rule B2 requires every
      # check to ship a control case, and these run first so a guard that has
      # stopped detecting anything fails the build loudly rather than passing
      # a tree it no longer inspects.
      #
      # These steps are deliberately order-independent: each provisions what it
      # needs. An earlier revision put the proofs before provisioning and the
      # job went red, because the gate's pass-path case cannot run without a
      # scanner. A step order that must be remembered is a step order that will
      # eventually be got wrong.
      - name: Prove the guards still catch what they claim
        run: npm run proof:guards

      - name: Prove provisioning is safe under concurrency
        run: npm run proof:provision

      - name: File policy (whole tree)
        run: node scripts/hooks/guardFiles.mjs --tree

      - name: Secret scan (full history)
        run: node scripts/hooks/scanSecrets.mjs
