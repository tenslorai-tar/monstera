# The build and test gate.
#
# Runs on windows-latest because Windows is the target platform and Part I
# requires native-behaviour claims to be proven there. The repository guards
# (secret scan, file policy) run separately in guards.yml on a faster runner,
# since those are text checks with no platform dimension.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CANCELLING IS FOR BRANCHES. `main` NEVER CANCELS — see the same block in
# `guards.yml` for the mechanism and the trade; both workflows carried the
# defect, so both carry the fix.
#
# In one line: a cancelled run is no verdict at all, so grouping `main` with
# `cancel-in-progress: true` meant every rapid push destroyed the previous
# commit's verdict — `9292d1f`, `142a2d6`, `53eafae` — and left a bisect landing
# on commits CI never evaluated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Typecheck, lint, and proofs (${{ matrix.os }})
    strategy:
      # Windows is the target platform and the one that must pass. Linux runs
      # the identical job as a differential: when a step fails on one and not
      # the other, the difference is the platform, which is a far smaller search
      # space than "CI is broken". It costs one runner and pays for itself the
      # first time it is needed.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # GitHub defaults `run:` to PowerShell on Windows and bash elsewhere, so
        # the same workflow executes under two different shells with different
        # quoting, different exit-code handling, and a different
        # $ErrorActionPreference. Pinning bash everywhere means a step that
        # passes locally behaves the same on every runner.
        #
        # `-o pipefail` is the load-bearing flag, not decoration. Without it a
        # pipeline reports the status of its LAST command, so `node build.mjs |
        # tail` exits 0 when the build failed — a green check for work that did
        # not happen. That has already produced a false pass twice in this
        # project's history, both times reported as success to a human.
        # `-e` and `-u` close the neighbouring cases: an unchecked failure
        # mid-script, and a typo'd variable expanding to empty.
        shell: bash -euo pipefail {0}
    steps:
      # Pinned by commit SHA, not by tag: a tag is mutable and its target runs
      # with this workflow's token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # EXACT, not a major. `24` resolves to the newest 24.x at job start,
          # so the npm that validates this lockfile changed without any commit —
          # and on 2026-08-19 it had diverged far enough from a developer machine
          # that the two disagreed about whether the lockfile was valid. Keep in
          # step with scripts/lib/toolchain.mjs, which records the bundled npm
          # and is asserted against this file by proof:toolchain.
          node-version: 24.19.0
          cache: npm

      - name: Toolchain versions
        run: node --version && npm --version && git --version

      # `npm ci` rather than `npm install`: it installs exactly the committed
      # lockfile and fails if package.json and the lockfile disagree. The
      # installer-size arithmetic and the generated NOTICE both assume a
      # reproducible tree (Part J).
      #
      # `--ignore-scripts` because a dependency's install script runs arbitrary
      # code with the job's credentials, and this repository's supply-chain
      # posture does not make an exception for CI. Nothing here needs one:
      # sharp resolves prebuilt platform packages, and the only local lifecycle
      # script is `prepare`, which bootstraps git hooks that CI has no use for
      # since it never commits.
      #
      # The failure text is re-emitted as a workflow annotation. GitHub serves
      # job logs only to authenticated callers but exposes annotations publicly,
      # so without this a contributor without repository access can see that
      # Install failed and nothing about why. Diagnosing it then costs a push
      # per hypothesis, which is how a one-line error turns into an afternoon.
      - name: Install
        run: |
          if ! npm ci --ignore-scripts 2>&1 | tee install.log; then
            echo "::error title=npm ci failed::$(grep -E '^npm (error|warn)' install.log | grep -viE 'npm error +\[|^npm error +-|Run \"npm help|complete log of this run' | head -12 | tr '\n' '|')"
            exit 1
          fi

      # The ARCHIVE is cached, not the extracted tree, and the key is the pinned
      # digest itself. Two consequences worth stating, because both are the
      # reason this is shaped the way it is:
      #
      # - The cache invalidates exactly when the content must change and never
      #   otherwise, so there is no staleness question to reason about.
      # - A restored archive is RE-VERIFIED against the pin before anything is
      #   extracted from it. A cache hit that skipped the digest check would turn
      #   a hash-pinned artifact into an unpinned one delivered by a store any
      #   run on this repository can write to — a supply-chain path with a green
      #   check on it. The cache optimises the DOWNLOAD, never the verification,
      #   and `proof:electronimports` covers the refusal with a control.
      - name: Cache the pinned Electron archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/electron-archives
          key: electron-archive-${{ runner.os }}-${{ hashFiles('scripts/provision/electron.mjs') }}

      # Fetches the pinned build, verifies it against the recorded SHA-256, and
      # extracts it under .tools/. Nothing imports the `electron` package to get
      # here — that import IS the download, which invariant 26 forbids.
      #
      # DISPLAY REQUIREMENT, stated before the first step that starts the
      # binary rather than after it fails: Electron needs an X display on Linux,
      # and `xvfb-run -a` is the answer. Without it the process does not error —
      # it HANGS, a hang reads as a flake, and a flake invites a timeout bump,
      # which is a banned reflex that arrives wearing a plausible story. Windows
      # needs nothing. Provisioning itself starts no process; the step that does
      # is the renderer read-back.
      - name: Provision the pinned Electron runtime
        run: node scripts/ci/annotate.mjs scripts/provision/electron.mjs

      # Build precedes the proofs that resolve compiled output: the boundary
      # proof lints imports of `@monstera/*`, which resolve through each
      # package's exports map to dist.
      #
      # `build`, not `typecheck`: the preload is BUNDLED to CommonJS as well as
      # compiled, because a sandboxed preload cannot load the ESM `tsc` emits
      # and cannot resolve a workspace package. Running only `typecheck` here
      # leaves the renderer with no bridge and no error anywhere — which is the
      # state this repository was in until a read-back asked the page.
      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint

      # A boundary that lints clean may simply be matching no files. This
      # violates every boundary on purpose and fails if any is permitted.
      # Two documents asserted the React rules were errors while ESLint
      # configured none of them. Checks the claim against the resolved config
      # AND that a violation is actually reported — a rule that is listed and
      # never fires prints identical --print-config output to one that works.
      # ESLint's ignore list is derived from .gitignore rather than duplicated.
      # The duplicate had drifted to five artifact paths against sixteen, and
      # with projectService an unignored build directory is a fatal parse error
      # rather than a warning — so the first Electron build would have failed
      # `eslint .` on a developer machine, which CI cannot reproduce because it
      # builds from a clean checkout. The control plants a violation in real
      # source, so a config that ignored the whole tree cannot pass.
      - name: Prove the lint ignores track .gitignore and still lint source
        run: node scripts/ci/annotate.mjs scripts/proofs/lintIgnores.proof.mjs

      - name: Prove the React lint rules are registered and fire
        run: node scripts/ci/annotate.mjs scripts/proofs/lintRules.proof.mjs

      # NOTICE's DEPENDENCY half, on the case-sensitive filesystem (finding C3).
      # The shim job runs this too and is the only place the NATIVE half can be
      # verified, because it is the only one with the MuPDF source — so this
      # step prints "NOT verified — MuPDF source not provisioned here" and that
      # is correct rather than a gap.
      #
      # What it adds is the platform. `licenceText` looks for `LICENSE`,
      # `COPYING` and nine other names in upper case, and NTFS matches a file
      # actually called `license` while ext4 does not. So a dependency shipping
      # a lower-case licence file would have its terms found on Windows, written
      # into NOTICE, and be unfindable by anyone acting on the source offer.
      # Measured before adding this: 36 production packages, no case
      # mismatches — so it passes today and goes red on the day one arrives,
      # which is the only day it matters.
      - name: Check NOTICE's dependency half on a case-sensitive filesystem
        run: node scripts/ci/annotate.mjs scripts/release/generateNotice.mjs --check

      # ADR-0026's class, the half no lint rule covers.
      # `no-import-type-side-effects` registers ImportDeclaration only, and
      # `consistent-type-exports` treats an inline `type` specifier as already
      # satisfying it, so `export { type X } from './y.js'` emits a runtime load
      # that nothing reports. One of those cost the kernel barrel 41.7 MB.
      #
      # AFTER the build step above, and that placement is the point: the scan
      # reads the EMIT, because the two spellings are identical in source and
      # only one of them runs. This is the fail-closed half — the pre-commit
      # copy reads whatever build is on disk and says so when there is none,
      # since blocking a contributor who has not run tsc yet teaches the one
      # habit this repository most forbids.
      - name: Prove the emitted-side-effect scan can see, refuse and separate
        run: node scripts/ci/annotate.mjs scripts/proofs/emittedSideEffects.proof.mjs

      # ARCHITECTURE §10.2: contrast is ENFORCED, not audited — computed from
      # the token file itself, so the check never needs a wholesale exemption.
      # ADR-0003 types the roles so it can be strict without one: a check over
      # every text role × every surface fails pairs that never render, and the
      # only ways out are an exception list or an exemption, both banned.
      #
      # The proof reproduces two figures ADR-0003 recorded from its own solve —
      # 3.04:1 for the split border and 1.16:1 for the alternative it rejected —
      # so the arithmetic is checked against something computed elsewhere rather
      # than only against itself.
      - name: Prove the token contrast check can see, refuse and separate
        run: node scripts/ci/annotate.mjs scripts/proofs/tokenContrast.proof.mjs

      - name: Every declared token pair meets its contrast obligation
        run: node scripts/ci/annotate.mjs scripts/lib/tokenContrast.mjs

      # ADR-0003's border rule. The scan examines nothing until the first
      # component stylesheet lands and says NOTHING TO SCAN rather than clean,
      # so the proof is what carries the claim that it can see — which is why
      # both steps are here from the day the scan is written rather than from
      # the day it has something to find.
      - name: Prove the border-token scan can see, refuse and separate
        run: node scripts/ci/annotate.mjs scripts/proofs/borderTokens.proof.mjs

      - name: No decorative border token bounds an unmarked control
        run: node scripts/ci/annotate.mjs scripts/lib/borderTokens.mjs

      - name: Prove the second-wiring-place scan can see, refuse and tolerate
        run: node scripts/ci/annotate.mjs scripts/proofs/secondWiringPlace.proof.mjs

      - name: No surface renders a hand-written command list
        run: node scripts/ci/annotate.mjs scripts/lib/secondWiringPlace.mjs

      - name: Prove the DOM-environment scan can see, refuse and tolerate
        run: node scripts/ci/annotate.mjs scripts/proofs/domEnvironment.proof.mjs

      - name: Only packages/ui may name a DOM environment
        run: node scripts/ci/annotate.mjs scripts/lib/domEnvironment.mjs

      - name: Prove the type-only export scan can see, separate and never be blind
        run: node scripts/ci/annotate.mjs scripts/proofs/typeOnlyExports.proof.mjs

      # THE GATE is the source scan, in the pre-commit set, against the index.
      # This one is the COMPLETENESS CONTROL over both halves: it reads the EMIT
      # and so answers *did a build emit a side-effect statement*, which is a
      # different question from *did you write one*. It is what would catch a
      # spelling the source pattern does not know about, and it needs a build,
      # which is why it lives here and not in the hook (finding QQQQ-1).
      - name: No type-only statement survives into the emit
        run: node scripts/ci/annotate.mjs scripts/lib/emittedSideEffects.mjs

      # The instrument the Stage 0 performance gate will use, resolution-tested
      # before it measures anything real. Its predecessor was a setInterval
      # sampler that could not fire while a synchronous FFI loop held the event
      # loop and reported 63 MB for a walk that cost 526 MB — reproducibly,
      # which is what made it convincing. The blocked-loop case here is that
      # exact failure mode, ruled out rather than assumed away.
      - name: Prove the peak-RSS instrument can tell two numbers apart
        run: node scripts/ci/annotate.mjs scripts/proofs/peakRss.proof.mjs

      # ADR-0010 recorded that koffi "needs Electron ABI prebuilds". It does
      # not: it is a Node-API addon, and its prebuilts are per platform-arch.
      # The real risk is that those prebuilts are OPTIONAL dependencies, so an
      # install omitting them leaves koffi resolving nothing and failing at the
      # first FFI call inside a shipped application. Runs on both platforms
      # because the lockfile pins a binary for each and either could go missing.
      - name: Prove the FFI binding is installed and callable
        run: node scripts/ci/annotate.mjs scripts/proofs/nativeAddon.proof.mjs

      - name: Prove the architecture boundaries are enforced
        run: node scripts/ci/annotate.mjs scripts/proofs/boundaries.proof.mjs

      # electron.d.ts is 56% comments, and a text search matches prose as readily
      # as a declaration — so it would witness a symbol that had been REMOVED,
      # which is the reassuring answer and is what invariant 25 rests on.
      # Measured on 43.4.1: utilityProcess occurs once in prose,
      # MessagePortMain ten times, MessageChannelMain not at all.
      #
      # HERE rather than in the shim job, which is where it first landed. This
      # job is a MATRIX over both platforms; the shim job is a single runner,
      # `windows-latest` (see its `runs-on` below). The parse itself is
      # platform-independent, but locating the compiler is not — `file://` plus
      # backslash replacement is a Windows branch and a plain path is the other,
      # and only a job that runs both executes both.
      #
      # CORRECTED 2026-08-23 (finding UUU-1): this said "the shim job is
      # ubuntu-only", which is false and was false when written — the shim job
      # has always been windows-latest, as a comment forty lines below its own
      # `runs-on` already said. The conclusion survives for a DIFFERENT reason
      # than the one given: both-platforms beats one-platform because it
      # exercises both branches, not because the other platform is the wrong one.
      # Item 7's compound claim — "this job installs on BOTH platforms" is true
      # and vouched for the false clause beside it.
      - name: Prove the Electron surface is parsed, not searched
        run: node scripts/ci/annotate.mjs scripts/proofs/electronSurface.proof.mjs

      # THE CHECK, beside the proof that says it can see. Registered 2026-08-28,
      # having been run by no workflow at all: the proof drove the module's
      # functions on fixtures and nothing pointed the check at this tree, so a
      # real violation here would have been caught by nobody. Found by deriving
      # the pre-push roster from these files and looking at what was missing.
      - name: The Electron surface this build exposes is the declared one
        run: node scripts/ci/annotate.mjs scripts/security/electronSurface.mjs

      # Invariant 1's IMPORT half, and the only half of the preload that can be
      # proven at all today: every workflow installs Electron with
      # --ignore-scripts, so electron.d.ts arrives and no binary does. A test that
      # launched a window and read the exposed object is unavailable, and one
      # asserting on the arguments handed to contextBridge would prove the call
      # was made rather than that the exposure is confined — a flag SET, not a
      # flag ENFORCED, which invariant 25 already refuses one layer down.
      #
      # HERE for the same reason as the step above: it parses a tracked source
      # file with the TypeScript compiler, and the Guards job runs no `npm ci`,
      # so it has none. It needs neither the Electron binary nor electron.d.ts.
      #
      # The allowlist is READ from ARCHITECTURE §9 invariant 1 rather than
      # restated, so amending the invariant changes what the preload may import
      # in the same commit (ADR-0012's rule, applied to names instead of numbers).
      - name: Prove the preload cannot import its way out of invariant 1
        run: node scripts/ci/annotate.mjs scripts/proofs/preloadSurface.proof.mjs

      # FFF-1, closing Y-3. Sixteen handlers that printed a stack and discarded
      # the `cause` were fixed by enumeration on 2026-08-20; a seventeenth
      # arrived on 2026-08-21. The rule names the two OWNERS of stack rendering
      # rather than defining the population of subjects, and the receiver's TYPE
      # decides, so a reader of a declared field is not reported and a comment is
      # not seen.
      #
      # HERE for the same reason as the two steps above: it builds a Program per
      # project with the TypeScript compiler, and the Guards job runs no
      # `npm ci`. Placing it there would have made it fail on every run — which
      # this machine, where node_modules always exists, could not have shown.
      - name: Prove the stack-ownership scan sees, refuses and separates
        run: node scripts/ci/annotate.mjs scripts/proofs/stackOwnership.proof.mjs

      - name: Only an owner renders a thrown value's stack
        run: node scripts/ci/annotate.mjs scripts/lib/stackOwnership.mjs

      # HHH-1. The step above was first registered on Guards, which runs no
      # `npm ci`, so it would have failed on every run — and no machine with
      # node_modules installed can reproduce that. This derives which scripts
      # DIE without them (a bare import, or an uncaught call to the compiler
      # loader, per function rather than per module) and requires every workflow
      # line running one to sit in a job that installs. Both facts are literal
      # in the tree; neither is a list.
      #
      # HERE for the reason it exists to check: it parses `scripts/` with the
      # compiler, so it needs the very thing it is about.
      - name: Prove the job-placement scan sees, refuses and tolerates
        run: node scripts/ci/annotate.mjs scripts/proofs/nodeModulesPlacement.proof.mjs

      - name: Every module-needing step sits in a job that installs
        run: node scripts/ci/annotate.mjs scripts/lib/nodeModulesPlacement.mjs

      # `require('electron')` from plain Node IS the download trigger:
      # node_modules/electron/index.js ends with `module.exports =
      # getElectronPath()`, which downloads when the binary is absent. So the pin
      # the Guards job checks is a record until nothing can route around it.
      #
      # HERE, and not with the pin's other eight cases, for the same reason as
      # the two steps above: the scan parses every .mjs under scripts/ with the
      # TypeScript compiler. It cannot grep — six lines under that root hold a
      # fixture string reading `import … from 'electron'`, three of them inside
      # proofs that enforce this very rule, and a scan that cries wolf is a scan
      # someone relaxes.
      #
      # It also asserts node_modules/electron/dist is absent, which is only
      # meaningful where a node_modules EXISTS — it is the check that
      # `--ignore-scripts` on line 89 actually prevented the install script from
      # unpacking a second, unpinned runtime.
      - name: Prove nothing can trigger the unpinned Electron download
        run: node scripts/ci/annotate.mjs scripts/proofs/electronImports.proof.mjs

      # HERE rather than on Guards, for the reason the three steps above are: it
      # spawns the TypeScript compiler against two fixture projects, and Guards
      # runs no `npm ci`. A case needing node_modules does not belong in that job
      # however much it belongs with those ones.
      #
      # What it covers is the gate that compiles this repository being reachable
      # from the local sweep at all. `npm run typecheck` is not a `check:*` name
      # and not a `node` command line, so `checkLocal.mjs` could invoke neither —
      # and a JSDoc block inserted between a function's documentation and the
      # function reddened `main` at 073e6d9 with nothing local able to see it.
      - name: Prove the typecheck runner separates a broken project from a clean one
        run: node scripts/ci/annotate.mjs scripts/proofs/typecheck.proof.mjs

      # The same gap, one gate along, and it cost a red board rather than being
      # reasoned about: `npm run lint` is not a `check:*` name and not a `node`
      # command line either, so the rule set governing every line of this
      # repository was outside the sweep that runs before every push. 7ba978c
      # added four ordinary lint errors, `npm run local -- --only check:`
      # reported 14 of 14 passed, and CI failed at "Lint" on all three jobs.
      #
      # Drives the real linter against fixture trees with their own flat config,
      # so it needs node_modules and belongs in this job rather than with Guards.
      - name: Prove the lint runner separates a violating tree from a clean one
        run: node scripts/ci/annotate.mjs scripts/proofs/lintcheck.proof.mjs

      # The FIRST check in this repository that starts Electron and reads
      # something back out of a running renderer. Two claims, split so a
      # provisioning failure costs the cheap half nothing: the directive list is
      # checked from the string and always runs; whether the renderer RECEIVES
      # and OBEYS that list needs the process, and prints UNVERIFIABLE rather
      # than passing when the runtime is absent.
      #
      # Enforcement is read from `securitypolicyviolation`, not from whether the
      # forbidden operations failed — a fetch to a bogus host fails on DNS
      # whatever the policy says, and the first version of this probe reported
      # "blocked" for a request CSP had just been loosened to permit.
      #
      # The proof applies `xvfb-run -a` itself on Linux rather than relying on a
      # wrapper here, so running it by hand behaves the same as running it in CI.
      # Electron needs an X display on Linux and the runner image provides none.
      # This is provisioning a platform capability, not working around our own
      # code — the same category as provisioning MuPDF or Electron itself.
      #
      # Note what is NOT done here: `--no-sandbox`. That is the usual advice for
      # Chromium on a CI box, and it would disable one of the protections the
      # very next step exists to verify. A proof that weakens the thing it
      # measures is worse than no proof.
      - name: Install a display server for the renderer read-back
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Chromium's SUID sandbox helper must be owned by root with mode 4755, and
      # a ZIP CANNOT CARRY EITHER — the format has no ownership, and extraction
      # runs as `runner`. So Electron found the helper, found it misconfigured,
      # and ABORTED rather than run unsandboxed. That refusal is Chromium being
      # right, and the whole reason this step exists rather than `--no-sandbox`.
      #
      # `--no-sandbox` is the answer every search result gives, and here it would
      # disable a protection the very next step is verifying — `sandbox: true` is
      # the first item in ARCHITECTURE §2's non-negotiable list. A read-back that
      # switched off the sandbox to observe the CSP would be measuring a
      # configuration the product never runs in.
      #
      # Scoped to the one helper binary, not the tree, and only on the runner.
      #
      # THE PATH IS ASKED FOR, not written here. It used to read
      # `.tools/electron/43.4.1/chrome-sandbox`, which made this the THIRD place
      # naming ELECTRON_VERSION in executable form and the only one tied to
      # nothing — the other two are held together by proof:electronprovision's
      # version-agreement case. B3a, and the same ruling the launcher got; it
      # simply did not read like it in YAML.
      #
      # It would have failed loudly on a bump — `pipefail`, and chown on a
      # missing path exits non-zero — but in the wrong language: "cannot access
      # .tools/electron/43.4.1/chrome-sandbox" reads as the provisioner not
      # producing the file, not as this workflow naming the version twice.
      #
      # This step is also why the cache holds the ARCHIVE and not the extracted
      # tree. Extraction runs every time, so the helper being configured is
      # always the one just extracted. Were the tree cached, this chown would be
      # correct today and wrong on the first warm-cache run — and the failure
      # would be a silently unsandboxed renderer, which is the one outcome the
      # step below cannot detect.
      #
      # Wrapped inside the command substitution (HHH-3). `annotate.mjs` passes
      # the child's stdout through verbatim and exits with its status, so `$()`
      # captures the same path and `pipefail` still sees the same failure — the
      # only difference is that a failure now says WHY in public. This line was
      # invisible to `check:annotatecoverage` twice over: no npm script names
      # this file, and the scan's word boundary admitted a command only after
      # whitespace or a shell operator, never after `$(`.
      - name: Configure Chromium's sandbox helper
        if: runner.os == 'Linux'
        run: |
          helper="$(node scripts/ci/annotate.mjs scripts/ci/sandboxHelperPath.mjs)"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          ls -l "$helper"

      - name: Prove the renderer receives and obeys the declared CSP
        # Through the annotation wrapper, because this is the step whose failure
        # was public as `Process completed with exit code 1` and nothing else.
        # Logs need a token; annotations do not. The two proofs below run the
        # same way for the same reason — they are the ones that need a runtime,
        # so they are the ones whose failures are hardest to reproduce.
        run: node scripts/ci/annotate.mjs scripts/proofs/rendererPolicy.proof.mjs

      # THE RENDER CLAUSE'S ONLY EVIDENCE, and it needs the display server the
      # step above installed for the same reason plus one more.
      #
      # PDF.js's display path schedules through `requestAnimationFrame`, and
      # Chromium fires none in a page whose `visibilityState` is `hidden`. So
      # without a display the render never completes and this proof reports a
      # canvas nothing drew on — which is exactly the defect it is looking for, a
      # false positive about a working renderer produced by the environment. The
      # proof refuses up front rather than discovering it after a timeout.
      #
      # Every other test of this renderer stays green for a canvas that draws
      # nothing: `renderPage.test.ts` runs against a shim with no canvas,
      # `App.test.tsx` asserts the element is in the tree, and the step above
      # asserts the React shell mounted. This is the one that reads pixels.
      - name: Prove the renderer's canvas carries a drawn page
        run: node scripts/ci/annotate.mjs scripts/proofs/canvasPixels.proof.mjs

      # THE VIEW MODEL'S LOAD-BEARING ASSUMPTION, and it needs no display.
      #
      # A rotation reaches the screen because PDF.js accepts one the parsed bytes
      # do not carry (finding OOOOO-1, ARCHITECTURE §2). If an upgrade made that
      # argument additive or ignored, the renderer would draw an unrotated page
      # while the kernel held the correct document — and every check in this
      # workflow would stay green, including the pixel proof above, which counts
      # what was drawn and not which way up it is.
      # THROUGH `annotate.mjs`, AND BY PATH, and a proof step owes both.
      #
      # `proofCoverage.mjs` asks whether a workflow invokes each `proof:*`
      # script and matches on the SCRIPT PATH, so `run: npm run proof:x` is a
      # proof CI genuinely runs and the coverage scan genuinely cannot see.
      # `annotateCoverage.proof.mjs` then asks whether every workflow proof step
      # is wrapped, because an unwrapped failure is public as `Process completed
      # with exit code 1` and nothing else — the job log needs a token, and an
      # annotation does not.
      #
      # Both said so on Guards, one after the other, and both were right.
      - name: Prove PDF.js takes a rotation the document does not carry
        run: node scripts/ci/annotate.mjs scripts/proofs/viewportRotation.proof.mjs

      # WHICH MODE A WORKER THREAD RUNS IN, which is a placement question with a
      # three-strike record: `apps/desktop/src/` is exempted from the
      # Electron-import ban as a proxy for "runs inside Electron", and the engine
      # host's reader is a worker thread inside main.
      #
      # Windows only, and with the flag only there: on Linux Electron needs a
      # display server and HANGS without one rather than failing, so a decline
      # there is legitimate rather than a red. The claim has an expiry no
      # document can enforce — whether a worker sees Electron's module is a
      # property of the runtime, and a version bump is what would change it in
      # silence.
      - name: Measure which runtime mode a worker thread runs in
        if: runner.os == 'Windows'
        run: node scripts/ci/annotate.mjs scripts/research/workerMode.mjs --require-electron

      # C5 claims an unhandled contract entry is a compile error. That cannot be
      # tested at runtime — a missing handler is just a channel that hangs — so
      # it is proven by compiling code that must not compile.
      # Reads the EMITTED JavaScript, because the source cannot answer it:
      # `import { type X } from './y.js'` keeps the specifier and runs, while
      # `import type { X }` is erased, and the two are indistinguishable to a
      # reader. Measured cost of getting it wrong: 38.1 MB of native MuPDF
      # binding loaded by importing the module that must never parse.
      - name: Prove DocumentService does not load the native shim
        run: node scripts/ci/annotate.mjs scripts/proofs/kernelLoad.proof.mjs

      - name: Prove the composition root's ceiling is ADR-0007's
        run: node scripts/ci/annotate.mjs scripts/proofs/composition.proof.mjs

      # The SECOND registration of this proof, and the flag is the whole reason.
      # Guards runs it too and builds nothing, so the desktop copy of
      # isInvalidHandle is UNVERIFIABLE there — could-not-look, printed apart
      # from the passes. This job builds, so here the copy is mandatory and its
      # absence is a failure. Same shape as --require-derivation on the advisory
      # register: unverifiable where nothing is provisioned, required on the one
      # job that provisions.
      - name: Prove the desktop copy of the invalid-handle rule matches its owner
        run: node scripts/ci/annotate.mjs scripts/proofs/win32Handle.proof.mjs --require-desktop-copy

      # Needs the display installed above, for the same reason the renderer
      # read-back does. A composition root known only to compile is one nobody
      # has run, which is the defect this repository found twice in a week.
      - name: Prove the shell runs and the renderer uses the contract
        run: node scripts/ci/annotate.mjs scripts/proofs/shell.proof.mjs

      - name: Prove the IPC contract is exhaustive
        run: node scripts/ci/annotate.mjs scripts/proofs/contract.proof.mjs

      # The writer-of-record matrix rests on measured engine behaviour, not on
      # type declarations. This re-measures it, so an engine upgrade that
      # changes any of those behaviours turns the build red instead of quietly
      # invalidating the architecture built on top of them.
      - name: Prove engine behaviour still matches the matrix
        run: node scripts/ci/annotate.mjs scripts/spike/engineSpike.mjs

      # The committed logo derivatives exist only because GitHub renders the
      # README with no build step. This fails if one no longer matches the
      # master it was generated from.
      - name: Check generated brand assets match the master
        run: node scripts/ci/annotate.mjs scripts/brand/generateAssets.mjs --check

      # No --passWithNoTests. The flag's only effect is to turn "no test files
      # found" from exit 1 into exit 0, which is the single signal that would
      # reveal a broken include glob, a renamed src layout, or a vitest config
      # that stopped matching. It was correct in b55fffa, a commit with zero test
      # files, and became a stale escape hatch the moment tests landed.
      - name: Unit tests
        run: npm test

      # `npm test` used to resolve every @monstera/* specifier through the
      # package's dist build, so the suite could read the last build while a
      # mutation sat in the source it covered — 27/27 green over a deleted line.
      # CI never showed it, because this job happens to run typecheck first; that
      # is step ordering in one file, not a property of the command, and the
      # pre-commit hook runs no tests at all. This proves resolution reaches
      # source, with a control that pins the aliases back at dist so the pass
      # cannot come from a poison that never took effect.
      #
      # Runs after the suite: it poisons build output and restores it, so a
      # failure here should not be able to explain away a failure above.
      - name: Prove the tests read source, not a stale build
        run: node scripts/ci/annotate.mjs scripts/proofs/testResolution.proof.mjs

      # RUN AGAIN, AFTER THE SUITE, AND THE ORDERING IS THE POINT.
      #
      # This proof has two halves. The static scans are best early — a violation
      # in the source should fail fast. The assertion that
      # `node_modules/electron/dist` does not exist is a statement about what
      # this job has done SO FAR, and running it early makes it structurally
      # blind to anything a later step does.
      #
      # Measured, not hypothesised: `import { type App } from 'electron'`
      # compiles to `import {} from 'electron'` — a side-effect import that
      # survives — and a unit test importing that module made plain Node fetch
      # the unpinned runtime. Locally, `node_modules/electron/dist` appeared at
      # the minute the test first ran. CI would have done the same and passed,
      # because the guard had already run 90 lines earlier.
      #
      # The invariant's own enforcers cannot reach this: ESLint's boundary
      # exempts `desktop` and the runtime scan's root stops at `scripts/`, so a
      # `.test.ts` under `apps/desktop/src` dragging Electron into a plain-Node
      # test runner is a route neither of them covers. This step is what covers
      # it, and it only covers it here.
      - name: Prove the test suite itself triggered no download
        run: node scripts/ci/annotate.mjs scripts/proofs/electronImports.proof.mjs

  # The native seam, on the only platform that can build it today.
  #
  # This job exists because ADR-0010's measurements were produced in a scratch
  # directory that no longer exists, so the decision the whole document pipeline
  # rests on could not be re-checked. Evidence that lives outside the repository
  # is evidence that will be deleted.
  # `package.json` promised `engines.node: ">=22.19.0"` while every job above ran
  # 24.19.0, so the floor was declared by a manifest and exercised by nothing —
  # the shape this project calls a finding everywhere else.
  #
  # The honest close is a check rather than a narrowing. Raising `engines` to 24
  # would shut out a contributor on Node 22 for no measured reason; testing the
  # claim costs one runner and a few minutes. If this row is ever judged too
  # expensive, narrow the claim in the same commit that deletes it.
  #
  # The JS-only half deliberately: install, typecheck, lint, tests. No native
  # build — the shim is a Windows toolchain matter and not what the floor claim
  # is about — and no proofs that need a provisioned engine. ubuntu because the
  # question is "does this Node run our JavaScript", which is not a platform
  # question, and one runner is the price.
  #
  # `proof:toolchain` keeps this version and `engines.node` the same number, and
  # fails if no job here runs the floor at all.
  floor:
    name: The declared Node floor actually runs (22.19.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # EXACT, and deliberately NOT the pinned runner version — this job
          # exists to run something the others do not. Kept in step with
          # engines.node by proof:toolchain.
          node-version: 22.19.0

      - name: Install
        run: |
          if ! npm ci --ignore-scripts 2>&1 | tee install.log; then
            echo "::error title=npm ci failed at the Node floor::$(grep -E '^npm (error|warn)' install.log | grep -viE 'npm error +\[|^npm error +-|Run \"npm help|complete log of this run' | head -12 | tr '\n' '|')"
            exit 1
          fi

      # The same `build` the matrix job runs. This job exists to prove the
      # declared Node floor can do everything the toolchain asks of it, and
      # bundling the preload is now part of that — a floor that typechecks but
      # cannot bundle would be a floor nobody can ship from.
      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  shim:
    name: Build the native MuPDF shim
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # EXACT, not a major. `24` resolves to the newest 24.x at job start,
          # so the npm that validates this lockfile changed without any commit —
          # and on 2026-08-19 it had diverged far enough from a developer machine
          # that the two disagreed about whether the lockfile was valid. Keep in
          # step with scripts/lib/toolchain.mjs, which records the bundled npm
          # and is asserted against this file by proof:toolchain.
          node-version: 24.19.0

      # MuPDF's static libraries take **336 seconds** to build on this runner and
      # change only when the pinned version does, so the key is the version
      # itself. A miss costs the build; a stale hit is impossible because the
      # version is in the key.
      #
      # That figure said "~10 minutes" until 2026-08-23, when it was read from
      # the Actions API rather than carried: the first shim run after this step
      # landed, at `4579645`, was necessarily a miss and took 336s. Warm runs
      # since have been 62-105s. XXX-1's decision turned on the number, and the
      # inherited one was nearly twice the measured one.
      #
      # THE IMAGE LABEL IS IN THE KEY, and `runner.os` alone was not enough.
      # `runner.os` is `Windows` for every Windows image, so the moment a second
      # one exists — `containment-2022` below — it would have RESTORED THIS
      # ENTRY rather than building its own, and the artefact is MSVC output
      # whose toolchain comes from the image. That is a wrong-artifact class,
      # not a slow build.
      #
      # The label is a literal rather than `${{ env.ImageOS }}`, because an
      # expression that resolves to nothing collapses two keys into one
      # SILENTLY, which is the failure this line exists to prevent. A literal
      # cannot be empty.
      #
      # `ImageVersion` is deliberately NOT in the key. It changes on every image
      # release, so including it would spend a cold build on both jobs every few
      # weeks to guard against within-image toolchain drift — which is finding
      # Y-3's territory (the cache restores without re-verifying) and wants a
      # verification, not a key that misses more often.
      - name: Cache the MuPDF build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/mupdf
          key: mupdf-windows-latest-1.28.0-${{ hashFiles('scripts/provision/mupdf.mjs') }}

      # THIS JOB IS THE ONLY PLACE THE ENGINE HOST CAN BE PROVEN, and until now
      # it could not run one (finding RR-1).
      #
      # Invariant 25's containment assertions need a utility process — Electron —
      # with koffi and the MuPDF shim loaded inside it. No job had both: the
      # matrix job provisions Electron and never builds MuPDF; this job builds
      # MuPDF and had no Electron. A fixture written against neither would have
      # been discovered on a runner, three seconds into a step, which is how
      # NN-1 was found.
      #
      # Extended HERE rather than adding MuPDF to the matrix job because every
      # property invariant 25 names is a Windows kernel object — job objects,
      # integrity levels, AppContainer — and this job is already windows-latest
      # and already carries the expensive artifact.
      #
      # Same cache key as the matrix job's, deliberately: one pinned archive, one
      # key, so the two jobs share a store entry rather than racing two spellings
      # of the same thing. The archive is RE-VERIFIED against the pin after
      # restore — the cache optimises the download, never the verification.
      - name: Cache the pinned Electron archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/electron-archives
          key: electron-archive-${{ runner.os }}-${{ hashFiles('scripts/provision/electron.mjs') }}

      - name: Install
        run: npm ci --ignore-scripts

      # Fetches the pinned build and extracts it under .tools/. Nothing imports
      # the `electron` package to get here — that import IS the download, which
      # invariant 26 forbids. No display concern: this runner is Windows, and
      # provisioning starts no process in any case.
      - name: Provision the pinned Electron runtime
        run: node scripts/ci/annotate.mjs scripts/provision/electron.mjs

      # Builds MuPDF from source against a pinned SHA-256, links the shim, and
      # fails if the DLL does not export every MZ_EXPORT symbol the source
      # declares.
      - name: Provision MuPDF and build the shim
        run: node scripts/ci/annotate.mjs scripts/provision/mupdf.mjs

      # THIS JOB NOW NEEDS COMPILED TYPESCRIPT, and it did not before.
      #
      # `proof:perfbudget` runs the performance gate, and the gate measures
      # `main` twice: once through a model and once through the real
      # `DocumentService`, which is compiled kernel code. This job installs with
      # `--ignore-scripts` and builds only native sources, so `packages/kernel/
      # dist/` did not exist here and the new role died three seconds in.
      #
      # `typecheck` and not `build`: the preload bundle is the other half of
      # `build` and nothing in this job loads a preload. The role itself refuses
      # a missing or stale build by name, so a job that forgets this step fails
      # with the remedy rather than with ERR_MODULE_NOT_FOUND.
      - name: Compile TypeScript, which the performance gate now measures
        run: npm run typecheck

      # The runner's host floor, which ADR-0025's derivation needs and nobody
      # has. `main`'s number was bound not by this machine but by the runner's,
      # and that ADR records what happened when the binding half was unmeasured:
      # a budget at or above the runner's figure "cannot catch this on the
      # runner, which is exactly what happened."
      #
      # `--always`, and that flag exists for this step. A measurement's value is
      # the numbers it prints on a GREEN run, and Actions logs are readable only
      # by the owner — so without it this would be the open item ADR-0025 already
      # carries: a figure waiting on an event that success prevents.
      #
      # Runs here because this job provisions the pinned Electron runtime and
      # compiles, which is everything the probe needs. It measures and never
      # asserts: no budget is enforced from it, and a number nobody has seen is
      # not one to gate on.
      - name: Measure the engine host's fixed cost on this runner
        run: node scripts/ci/annotate.mjs --always scripts/research/hostFixedCost.mjs --runs 15

      # ADR-0027's provisioning grant. The derivation is checked on every
      # platform; the grant/revoke round trip needs icacls and runs here, on a
      # THROWAWAY file rather than on the real paths — a proof that granted the
      # runtime would leave the machine in a state its own success depended on,
      # and a later run could not tell "the grant works" from "a previous run
      # left it granted", which is the stale-answer shape.
      - name: Prove the container grant derives, takes and reverses
        run: node scripts/ci/annotate.mjs scripts/proofs/containerGrants.proof.mjs

      # THE ACCEPTANCE TEST, and the anchor the grant roster never had.
      #
      # `proof:containergrants` asks whether the set is well formed; it cannot
      # ask whether it is COMPLETE, and incompleteness is the failure this whole
      # thread paid for — the four-path set was well formed for four days while a
      # contained host could not read its own program. The roster can go stale
      # again the next time the host loads something new, and the only thing that
      # cannot agree with a roster gone quiet is a host actually starting.
      #
      # It revokes before it grants, because a machine already granted cannot
      # tell "the grant works" from "it would have worked anyway" — refusal and
      # impossibility produce the same observation otherwise. Grants are restored
      # on every path and read back.
      #
      # Needs the build and the provisioned runtime, which this job has.
      - name: A contained host starts, and does not without the grant
        run: node scripts/ci/annotate.mjs --always scripts/research/containedStart.mjs

      # THE CONNECTION, END TO END, ON A MACHINE THAT IS NOT MINE.
      #
      # `containedStart.mjs` above proves a contained host STARTS. Nothing
      # proved that anything can then talk to one: the pipe, the reader thread,
      # the `connected` message, the factory that waits for it, and the teardown
      # had unit tests over injected surfaces and had never run against a real
      # process anywhere but one developer machine. YYYY-1 is exactly what that
      # gap produces — a defect no unit test could hold, found by writing the
      # first caller.
      #
      # `--no-document` because the generated fixture corpus is not tracked, so
      # a runner has none; this cell needs none, and it still exercises every
      # part of the path above. The peak it prints is also §9.17's `mupdf-host`
      # fixed cost read on a clean machine, which ADR-0025 needs across machines
      # rather than across one.
      #
      # Runs AFTER `containedStart.mjs` deliberately: that script restores the
      # grants on every path, including the ones where it throws, so this step
      # inherits a granted machine rather than racing it for one.
      #
      # `--always` for the same reason `baselineSpread` has it — the figure is
      # the point, and a passing step's log needs owner authentication to read.
      - name: A contained host CONNECTS and answers, and reports its fixed cost
        run: node scripts/ci/annotate.mjs --always scripts/perf/roleMupdfHost.mjs --no-document

      # AND A KILLED HOST RECOVERS, which retention makes possible and does not
      # make true. Every case that exercised `onEngineHostEnded` injected the
      # rebuild, so what they proved was the ordering — and the first run against
      # a real process found the shell building a new host and never restoring
      # the session, because the ending inherited the async context of the lane
      # the host was lazily built inside and the reopen was refused as reentry.
      #
      # `--require-containment` for the same reason `lowboxSpike` has it: this
      # job asserts that it CAN look, so could-not-look is a failure here rather
      # than the UNVERIFIABLE a developer machine without a runtime prints.
      #
      # THIS JOB ONLY, and that is a decision rather than an omission. The
      # `containment-2022` job exists because invariant 25's DIFFERS rows are
      # build-dependent; nothing measured says recovery is, so a second image
      # would buy a duplicate rather than a differential — and the day something
      # does say so, the pin belongs beside that job's `runs-on:`.
      #
      # Runs after the two steps above for the reason the second does: they
      # leave a granted machine rather than racing one.
      - name: A killed engine host recovers, against a running process
        run: node scripts/ci/annotate.mjs scripts/research/hostRecovery.mjs --require-containment

      # THE SWEEP, AGAINST A REAL LISTING. `sessionDirectories.test.ts` covers
      # every decision the sweep makes and supplies the listing to do it, so the
      # shipped `list` — the filter that keeps `rmSync(recursive)` off a FILE
      # named like a session directory — is stubbed in all of them.
      #
      # Here rather than on Guards because it drives the BUILT modules: this
      # job has them, and Guards installs without building.
      - name: The session-root sweep, against a real directory
        run: node scripts/ci/annotate.mjs scripts/proofs/sessionSweep.proof.mjs

      # THE SAME PROOF THE UBUNTU JOB RUNS, HERE FOR THE HALF IT CANNOT (YYYY-2).
      #
      # `peakWorkingSetOf` is `Get-Process` and throws on every other platform,
      # so `reportPeakOf`'s two cases skip on ubuntu — and a case that runs
      # nowhere in CI is a case that does not exist. This job is where the
      # parent-side peak is a real question, and it is the reading every
      # `--always` figure above depends on being sound.
      #
      # Running one proof on two platforms is deliberate rather than
      # duplication: the two runs cover disjoint halves and each says which half
      # it skipped.
      - name: Prove the peak-RSS instrument on the platform its parent-side read needs
        run: node scripts/ci/annotate.mjs scripts/proofs/peakRss.proof.mjs

      # And proves that export check can fail, by pointing it at a DLL missing a
      # declared symbol — the state a build that silently did not run leaves.
      - name: Prove the shim's export check is not vacuous
        run: node scripts/ci/annotate.mjs scripts/provision/mupdf.proof.mjs

      # INVARIANT 25, ASSERTED AGAINST FOUR RUNNING PROCESSES (RR-3, ADR-0023 §6).
      #
      # A job has to carry four things at once to run this, and every clause is
      # load-bearing: Windows, because AppContainer and job objects are Windows
      # kernel objects; a built MuPDF, because the point is a host with the
      # ENGINE in it rather than whether Node starts in a container (QQ-2); a
      # provisioned Electron, because every cell is the Electron binary in Node
      # mode; and compiled TypeScript, which is what puts the SHIPPED surface on
      # disk for the cells to be created by. This step is what discharges finding
      # TT-1 — the Electron provisioning above has a consumer.
      #
      # This was the only such job until `containment-2022` below, which carries
      # the same four on a second Windows image. See that job for why one image
      # is a sample of one.
      #
      # `--require-containment` turns could-not-look into a hard failure. Without
      # it the proof reports UNVERIFIABLE and exits 0 where Windows, the shim or
      # the build is missing, which is honest on a developer machine and would be
      # a green board for a check that never ran on the one job that exists to
      # run it.
      #
      # It CHANGES MACHINE STATE and reverses it: five ACL grants and an
      # AppContainer profile, released and deleted unconditionally on the way
      # out. The profile deletion is the instrument's job because the shipped
      # surface deliberately never deletes one — deleting drops every ACE naming
      # it, which is right for an application and wrong for a check that runs on
      # every push.
      #
      # Measured at 5 seconds on the developing machine, which is why it sits
      # here rather than being weighed against the sweep's budget.
      # `--expect-lowbox-spawn` PINS THE ONE ROW THIS PROOF DOES NOT ASSERT
      # (finding AAAA-1). The LowBox-alone process-creation row expects `either`,
      # because the container's answer varies by Windows build — which left the
      # value with no recorder at all: it was printed for a reader and CI has no
      # reader, so the only event anybody cares about, the answer CHANGING, was
      # unobservable. `refused` is what `windows-latest` measured on 2026-08-23.
      #
      # A literal beside the `runs-on:` that chose the image, for the same reason
      # the cache key carries a literal: the pin belongs where the image is
      # chosen, in the diff, not in a table someone has to map.
      #
      # THE COST IS REAL AND IT IS THE SIGNAL. A Microsoft image change turns
      # this red for something that is not a defect here — Decision 8 does not
      # depend on this row, because the JOB delivers invariant 25(b) — so the
      # failure text says exactly that, names the image, and sends the reader to
      # repair the pin and record the new reading rather than hunt a bug.
      - name: Prove invariant 25's containment against running processes
        run: node scripts/ci/annotate.mjs scripts/research/lowboxSpike.mjs --require-containment --expect-lowbox-spawn=refused

      # THE TRANSPORT STOPS, and this is the half that cannot be retrofitted.
      # `HostRuntimeTransport` declares `terminate(reason)` as a first-class
      # operation and Decision 8 kills the host rather than resuming it, so the
      # reader must come down at an arbitrary moment. A thread blocked in
      # `ReadFile` is unwedged with `CancelIoEx` or by closing the handle
      # underneath it; a thread waiting over completion-plus-stop returns.
      #
      # Two waits, because a reader has two: for a client, then for bytes. The
      # first is where a `terminate()` most often lands — a host that never
      # connects is what Decision 8 kills for.
      #
      # Here rather than on Guards for the ordinary reason: it needs
      # node_modules and a built dist, and it is Win32 the whole way down.
      - name: Prove the transport's reader stops without interrupting a syscall
        run: node scripts/ci/annotate.mjs scripts/research/transportTeardown.mjs --require-transport

      # The OTHER direction, and it decides how writes reach the pipe at all. A
      # reader inside `WaitForMultipleObjects` cannot be told anything — measured
      # by the step above — so writes cannot travel to it by `postMessage`. What
      # this measures is whether main can issue them itself without ever
      # blocking: 64 × 4096 bytes into a peer that never reads, with the
      # completions reaped non-blockingly afterwards.
      #
      # Its load-bearing case is that backpressure was REACHED. If every write
      # completes inline the kernel absorbed everything, and "no write blocked"
      # would be true for a reason that says nothing about a full pipe.
      - name: Prove main can write to the transport without blocking
        run: node scripts/ci/annotate.mjs scripts/research/transportWrite.mjs --require-transport

      # THE SHIPPED write path, as opposed to the Win32 facts above. It drives
      # `createWin32WriteSurface` and `createHostWriteQueue` from the built
      # output, so the adapter is RUN rather than merely typed — a compiler
      # cannot see a `WriteFile` whose arguments are in the wrong order.
      #
      # Its load-bearing case is the bound's control: 16 frames pass a limit of
      # 8 while the peer is draining. A limit that counted TOTAL writes passes
      # the overrun case, because nothing completes into a silent peer.
      - name: Prove the shipped write path carries, bounds and tears down
        run: node scripts/ci/annotate.mjs scripts/research/transportWriteSurface.mjs --require-transport

      # THE READ SIDE, end to end through the shipped reader thread. It closes
      # CCCC-2: `proof:teardown` measures termination and nothing about bytes
      # crossing, so a reader that ended cleanly having read nothing satisfied
      # it.
      #
      # Its load-bearing case is that the bytes arrived in MORE THAN ONE chunk.
      # Written as a single batch first, all sixteen frames landed in one read
      # and the loop's second iteration — where a transport spends its life —
      # had never executed while every other case passed.
      - name: Prove the shipped reader carries bytes and stops when told
        run: node scripts/ci/annotate.mjs scripts/research/readerWorker.mjs --require-transport

      # Executes CVE-2026-7233's disclosed trigger against the built engine and
      # proves the fix is load-bearing by rebuilding libmupdf without it and
      # confirming the same input then crashes. Guards against a future MuPDF
      # bump silently dropping the bounds check.
      - name: Prove the CFF over-read is fixed and the check is load-bearing
        run: node scripts/ci/annotate.mjs scripts/security/cffOobProof.mjs

      # Invariant 24: opening a document runs none of its content. Builds a
      # fixture whose JavaScript ANNOUNCES itself, runs it through the shim's
      # exact call sequence with an observer installed, and confirms silence —
      # against a control, in the same run, that fires the same payload with
      # pdf_enable_js. It also measures that the shipped shim links no
      # interpreter at all, which is the containment's real mechanism and is a
      # property of the call graph rather than of the build.
      - name: Prove no embedded JavaScript, action or file runs on open
        run: node scripts/ci/annotate.mjs scripts/security/activeContentProof.mjs

      # The cheap page-geometry path is the viewer's scroll-layout source (L21).
      # It must agree with fz_bound_page exactly, on documents with inherited
      # /Rotate and with a /CropBox — the two shapes a flat fixture cannot show,
      # and the two the old hand-rolled reads got wrong.
      - name: Prove cheap page geometry agrees with the expensive path
        run: node scripts/ci/annotate.mjs scripts/proofs/pageGeometry.proof.mjs

      # Holds the purge census to an equation rather than to a comment:
      # cached_after == cached_before - droppable. The load-bearing fixture is
      # the one edited in memory after rendering, where a per-object-number walk
      # and a per-section walk genuinely see different populations.
      - name: Prove the purge census mirrors pdf_clear_xref
        run: node scripts/ci/annotate.mjs scripts/proofs/purgeCensus.proof.mjs

      # NOTICE is generated from the production dependency tree and from what
      # libmupdf actually compiles. This job has the MuPDF source, so it is the
      # only place the native half can be verified rather than trusted — and
      # that comparison has already been worth it twice, catching six libraries
      # declared but never linked and five linked but never declared, openssl
      # among them.
      - name: Check NOTICE against the tree and the native build
        run: node scripts/ci/annotate.mjs scripts/release/generateNotice.mjs --check

      # Every bundled licence now cites the file its terms were read from, and
      # that file must still contain a marker distinguishing those terms. The
      # earlier claim — "read from each library's own licence file" — was prose
      # nobody could check, and two of the sixteen are not where a reader would
      # look: leptonica keeps its terms in leptonica-license.txt, and libjpeg
      # ships no licence file at all. The marker half is what catches an upstream
      # RELICENSING on a version bump, which is the real exposure: these arrive
      # inside someone else's tarball, so nobody here reviews their licence
      # changes when they happen. This job has the source, so it is where the
      # real declaration gets checked rather than skipped.
      - name: Prove every bundled licence matches the file it cites
        run: node scripts/ci/annotate.mjs scripts/proofs/licenceProvenance.proof.mjs

      # The advisory register holds a NOT-REACHABLE verdict for Tesseract and
      # Leptonica, and it rests on a list of the public MuPDF functions that can
      # reach them. That list is derived from the compiled source rather than
      # written down, because a hand-written door list is a claim of the same
      # kind as the verdict it supports. The derivation was wrong four times and
      # every failure produced the reassuring answer — "nothing reaches
      # Tesseract" — so it is resolution-tested before anything rests on it. The
      # case that matters is fz_clone_text_span: same file as a real door, no
      # path to OCR, and only a correct analysis tells them apart.
      - name: Prove the OCR door derivation can tell a call path from none
        run: node scripts/ci/annotate.mjs scripts/proofs/ocrDoors.proof.mjs

      # Same shape as the Electron surface check above: the proof ran here and
      # the check ran nowhere.
      - name: No door into the OCR subsystem is open in this build
        run: node scripts/ci/annotate.mjs scripts/security/ocrDoors.mjs


      # The register runs in Guards too, and there it CANNOT derive the door set:
      # that job does not provision MuPDF, so the doors report as unverifiable
      # and are counted apart rather than failing. This is the other half of that
      # pair, and without it the derivation would be verified in no job at all —
      # "unverifiable everywhere" is a stable, quiet state, which is exactly what
      # the unverifiable bucket exists to make visible rather than to permit.
      #
      # --require-derivation turns an unprovisioned source into a failure. This
      # job has the source, so here "could not look" is a defect in the job, not
      # a fact about the machine.
      - name: The OCR door set is derived HERE, where the source exists
        run: node scripts/ci/annotate.mjs scripts/security/engineAdvisories.mjs --require-derivation

      # The door check answers a question about our source text: does any shipped
      # file NAME a door. This answers the one about the binary: walking forward
      # from the 24 exports, can anything be reached. The two differ where an
      # export reaches a door through an intermediate that names it for us, and
      # fz_new_document_writer makes that concrete — it picks a writer from a
      # file extension, so a path ending .ocr runs Tesseract with no caller
      # naming an OCR symbol. The control is the point: a shim that DOES route a
      # path into the dispatcher must be reported as reaching, or a walk that
      # returns the empty set for every input would pass everything else.
      - name: Prove no shim export reaches the OCR subsystem
        run: node scripts/ci/annotate.mjs scripts/proofs/shimReach.proof.mjs

      - name: No shim export in this build reaches the OCR subsystem
        run: node scripts/ci/annotate.mjs scripts/security/shimReach.mjs

      # Invariant 23 (ADR-0015). The measurement above is true today and would
      # have to be re-established at every engine release; this removes the class
      # instead. The banned set is derived from MuPDF's own is_extension, so a
      # writer added upstream joins it with no list to edit. The resolution cases
      # are what keep it usable: fz_open_document and pdf_save_document take a
      # path and are NOT dispatchers, because a rule banning every path-taking
      # function would ban the shim's own save and be switched off within a week.
      - name: Prove the invariant-23 scan derives a dispatcher set and can refuse
        run: node scripts/ci/annotate.mjs scripts/proofs/pathDispatch.proof.mjs

      # AND THEN POINT IT AT THE REPOSITORY (finding DDDD-29). The step above
      # was called "Enforce invariant 23" for a range while running the PROOF,
      # which establishes the scan can see and never looks at a single shipped
      # file. The gate existed, was proven sound, and was never fired — and the
      # step's own name is what made that invisible, because a reader who sees
      # `pathDispatch` under the word *Enforce* stops there.
      #
      # HERE, WHERE THE SOURCE EXISTS, for the reason the OCR-door step above
      # gives: the banned set is derived from MuPDF's own `is_extension`, so the
      # scan exits 1 with "the dispatcher set was NOT derived and nothing was
      # checked" wherever the source is absent. That refusal is correct and it is
      # why this cannot live on Guards, which provisions nothing.
      - name: Enforce invariant 23 — no shipped file names a filename dispatcher
        run: node scripts/ci/annotate.mjs scripts/security/pathDispatch.mjs

      # A REPORTER WITH ONE CONTROL, not a gate, and named as one. It measures
      # which format parsers are actually present in the shipped DLL — `epub`,
      # `xps`, `svg`, `mobi` and `fb2` absent, `html` and `office` present as of
      # this build — and exits 0 either way. What it can fail on is its control:
      # if the PDF markers are not found it cannot see, and the footprint it
      # reports means nothing. Runs here because it reads the built DLL.
      - name: Report the shipped parser footprint, and prove the reader can see
        run: node scripts/ci/annotate.mjs scripts/security/handlerFootprint.mjs

      # ADR-0016. fz_open_document scores handlers on CONTENT, and the shim's
      # "not a PDF" refusal used to come from pdf_specifics AFTER the foreign
      # parser had already opened the file. Both paths return the same error
      # code, so the only observable difference is the MESSAGE — this asserts the
      # refusal is MuPDF's "cannot find document handler" rather than the shim's
      # post-hoc one. Runs against the real DLL, with a real PDF opening as the
      # control, since "refuses everything" would otherwise pass.
      - name: Prove only PDF is opened, and foreign formats fail at recognition
        run: node scripts/ci/annotate.mjs scripts/proofs/documentHandlers.proof.mjs

      # The Stage 0 performance gate. Runs here because it needs the built shim:
      # the mupdf-host role is the process that holds the parser, and measuring
      # it without one would measure nothing.
      #
      # No limit appears in the proof. It mutates the declared line in §9.17 and
      # requires the gate's verdict to move with it, with the thresholds derived
      # from what was measured — a proof carrying its own copy of the budgets
      # would be a fourth copy of the numbers, in the place people look last, and
      # it would pass forever while the invariant said something else.
      # Through the annotation wrapper. This proof measures RSS on the runner, so
      # its failures are the least reproducible kind there is — and it failed
      # twice here with the only public evidence being an exit code, which is the
      # gap `scripts/ci/annotate.mjs` was written for and which I did not apply
      # to the proof that needed it most.
      - name: Prove the performance gate follows the declared budgets
        run: node scripts/ci/annotate.mjs scripts/proofs/perfBudget.proof.mjs

      - name: The measured roles are inside §9.17's budgets
        run: node scripts/ci/annotate.mjs scripts/perf/budgetGate.mjs

      # WWWW-1'S CONTROL. A ~5.8 MB shift in every role's baseline was observed
      # here across an event — an eight-hour hung `vitest` tree being killed —
      # and "sessions differ" and "memory pressure was released" fit that
      # observation identically, including all three roles moving together.
      #
      # A runner is the strongest control available: it starts clean every time,
      # so it has no hung process to free, and successive runs are genuinely
      # separate sessions on identical images. `--always` because the figure is
      # the whole point and a passing step's log is unreadable without owner
      # authentication (ADR-0025's note of 2026-08-27).
      #
      # Fifteen readings, not thirty: this step exists to bound BETWEEN-run
      # variation, and the within-run spread is already 0.2 MB from two machines.
      - name: Measure main-service's baseline spread on a clean machine
        run: node scripts/ci/annotate.mjs --always scripts/research/baselineSpread.mjs --runs 15 --role main-service

  # ---------------------------------------------------------------------------
  # INVARIANT 25 ON A SECOND WINDOWS IMAGE (finding XXX-1).
  #
  # ## What this buys, and it is NOT what raised the finding
  #
  # XXX-1 came from the `(b) process creation — LowBox alone` row, which split
  # between `windows-latest` and Windows 11 and now asserts `either`. A second
  # image can no longer change that row's verdict, so it buys nothing there. Do
  # not let this job's stated reason expire with the row that prompted it.
  #
  # What it buys is the DIFFERS rows: (c) network, both (d) filesystem rows, IPC
  # and (b)-with-job. Those are the rows the design rests on — they are what
  # ADR-0023's Decision 8 and invariant 25 actually claim — and their
  # build-dependence has never been measured. One Windows image is a sample of
  # one, and the `either` row is the standing demonstration that this sample size
  # hides real variation.
  #
  # ## A separate job, not a matrix leg
  #
  # A matrix would put `proof:cff` on both legs: its own skip at
  # `cffOobProof.mjs:82` is keyed on `process.platform !== 'win32'`, and both
  # legs are Windows, so excluding one needs a workflow-level `if:`. That
  # conditional fails in the reassuring direction — the day a label goes stale
  # the expression matches neither leg, the proof skips on both, and the job is
  # green. A CVE proof that can silently not run is the green-check-that-verifies
  # -nothing shape, guarding the one thing here that is a real vulnerability.
  #
  # A separate job has no conditional to get wrong, keeps the shim job's
  # `runs-on` a literal so `check:jobplacement` keeps deriving a real image name
  # at exactly the place UUU-1 fired, and pays instead in duplicated provisioning
  # steps. That is the cheaper price.
  #
  # ## What it costs, measured rather than estimated
  #
  # Read from the Actions API, 2026-08-23. A COLD MuPDF build is **336s** — the
  # first shim run after the cache step landed, at `4579645`, which was
  # necessarily a miss. Warm runs since have been 62-105s. So this job costs
  # ~375s on its first run and on every rotation of the MuPDF key, and ~110s
  # steady state. `proof:cff` is deliberately absent, and it is 339s of the shim
  # job's 521s.
  #
  # The workflow comment above the shim job's cache step said "~10 minutes",
  # which was inherited rather than measured. It is 5.6.
  #
  # ## Why windows-2022
  #
  # Read from `actions/runner-images` rather than recalled: `windows-latest` IS
  # Windows Server 2025, so `windows-2025` would be the same image under another
  # name. `windows-2022` is Server 2022, a genuinely different kernel build.
  # `windows-11-arm` is arm64 and would need an arm64 MuPDF and an arm64
  # Electron — a different measurement, not a second sample of this one.
  #
  # A retired label fails LOUDLY here: the job finds no runner. That is the
  # opposite direction from the `if:` expression rejected above, and it is why
  # the label is allowed to be a literal.
  containment-2022:
    name: Prove invariant 25's containment on Windows Server 2022
    runs-on: windows-2022
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Held in step with the shim job deliberately. If these two ever
          # disagree, a containment difference between the images could be a
          # Node difference instead, and the job stops being a second sample of
          # the thing under test.
          node-version: 24.19.0

      # ITS OWN CACHE ENTRY. See the shim job's key for why the image label is a
      # literal here rather than an expression.
      - name: Cache the MuPDF build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/mupdf
          key: mupdf-windows-2022-1.28.0-${{ hashFiles('scripts/provision/mupdf.mjs') }}

      # The Electron archive is a downloaded, hash-verified artefact rather than
      # something this image builds, so it is image-independent and SHARES the
      # shim job's key on purpose — one pinned archive, one entry. The archive is
      # re-verified against the pin after restore; the cache optimises the
      # download, never the verification.
      - name: Cache the pinned Electron archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/electron-archives
          key: electron-archive-${{ runner.os }}-${{ hashFiles('scripts/provision/electron.mjs') }}

      - name: Install
        run: npm ci --ignore-scripts

      - name: Provision the pinned Electron runtime
        run: node scripts/ci/annotate.mjs scripts/provision/electron.mjs

      - name: Provision MuPDF and build the shim
        run: node scripts/ci/annotate.mjs scripts/provision/mupdf.mjs

      # Puts the SHIPPED surface on disk. The cells are created by
      # `apps/desktop/dist/win32HostSurface.js`, not by anything this instrument
      # hand-rolls, which is what makes the reading a statement about the
      # product rather than about the spike.
      - name: Compile TypeScript, which puts the shipped surface on disk
        run: npm run typecheck

      # `--require-containment`, for the same reason it is on the shim job:
      # without it the proof reports UNVERIFIABLE and exits 0 wherever Windows,
      # the shim or the build is missing, and this job would go green having
      # measured nothing. Since the whole point of the job is a SECOND reading,
      # a silent could-not-look here would be worse than on the first — it would
      # look like agreement.
      #
      # `refused`, MEASURED 2026-08-23 at `0909970`, CI run 32659310667 step 10.
      #
      # It was landed as a deliberate probe — Server 2022's contained answer had
      # never been read, because this job's first run asserted only the
      # uncontained half — and the probe resolved on its first run rather than
      # going red. That killed the chronological hypothesis: Windows 11 ALLOWS,
      # Server 2025 refuses, Server 2022 refuses.
      #
      # IT DID NOT ESTABLISH client-versus-server, which is how it was recorded
      # for a day (finding AAAA-8). Two of the three points are GitHub-hosted CI
      # images and the third is a developer machine, so the one client point is
      # also the one not-a-CI-image point and both explanations survive.
      #
      # The discriminating test is `windows-11-arm` — Windows 11 is a client SKU
      # and is GitHub-hosted — at the price of an arm64 MuPDF and an arm64
      # Electron, and it is ASYMMETRIC: client and arm64 move together there, so
      # a refusal falsifies the reading and an allow confirms nothing. Worth
      # recording, not worth scheduling: no verdict in the proof moves either
      # way, and shipping runs Windows 11 client x64, where Decision 8 already
      # says the job carries (b). See the instrument's header.
      #
      # A red board on this step remains a MEASUREMENT rather than a defect —
      # see the failure text, which names the image and sends the reader to
      # repair the pin.
      - name: Prove invariant 25's containment against running processes
        run: node scripts/ci/annotate.mjs scripts/research/lowboxSpike.mjs --require-containment --expect-lowbox-spawn=refused

      # THE TRANSPORT STOPS, and this is the half that cannot be retrofitted.
      # `HostRuntimeTransport` declares `terminate(reason)` as a first-class
      # operation and Decision 8 kills the host rather than resuming it, so the
      # reader must come down at an arbitrary moment. A thread blocked in
      # `ReadFile` is unwedged with `CancelIoEx` or by closing the handle
      # underneath it; a thread waiting over completion-plus-stop returns.
      #
      # Two waits, because a reader has two: for a client, then for bytes. The
      # first is where a `terminate()` most often lands — a host that never
      # connects is what Decision 8 kills for.
      #
      # Here rather than on Guards for the ordinary reason: it needs
      # node_modules and a built dist, and it is Win32 the whole way down.
      - name: Prove the transport's reader stops without interrupting a syscall
        run: node scripts/ci/annotate.mjs scripts/research/transportTeardown.mjs --require-transport

      # The OTHER direction, and it decides how writes reach the pipe at all. A
      # reader inside `WaitForMultipleObjects` cannot be told anything — measured
      # by the step above — so writes cannot travel to it by `postMessage`. What
      # this measures is whether main can issue them itself without ever
      # blocking: 64 × 4096 bytes into a peer that never reads, with the
      # completions reaped non-blockingly afterwards.
      #
      # Its load-bearing case is that backpressure was REACHED. If every write
      # completes inline the kernel absorbed everything, and "no write blocked"
      # would be true for a reason that says nothing about a full pipe.
      - name: Prove main can write to the transport without blocking
        run: node scripts/ci/annotate.mjs scripts/research/transportWrite.mjs --require-transport

      # THE SHIPPED write path, as opposed to the Win32 facts above. It drives
      # `createWin32WriteSurface` and `createHostWriteQueue` from the built
      # output, so the adapter is RUN rather than merely typed — a compiler
      # cannot see a `WriteFile` whose arguments are in the wrong order.
      #
      # Its load-bearing case is the bound's control: 16 frames pass a limit of
      # 8 while the peer is draining. A limit that counted TOTAL writes passes
      # the overrun case, because nothing completes into a silent peer.
      - name: Prove the shipped write path carries, bounds and tears down
        run: node scripts/ci/annotate.mjs scripts/research/transportWriteSurface.mjs --require-transport

      # THE READ SIDE, end to end through the shipped reader thread. It closes
      # CCCC-2: `proof:teardown` measures termination and nothing about bytes
      # crossing, so a reader that ended cleanly having read nothing satisfied
      # it.
      #
      # Its load-bearing case is that the bytes arrived in MORE THAN ONE chunk.
      # Written as a single batch first, all sixteen frames landed in one read
      # and the loop's second iteration — where a transport spends its life —
      # had never executed while every other case passed.
      - name: Prove the shipped reader carries bytes and stops when told
        run: node scripts/ci/annotate.mjs scripts/research/readerWorker.mjs --require-transport
